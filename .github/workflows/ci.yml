name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # One platform's failure must not cancel the other two.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout: 60
          - os: windows-latest
            timeout: 45
          - os: macos-latest
            timeout: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ext/droid-lsp provides circuits.json, which is compiled in with
          # include_str!, so the checkout cannot skip submodules. The submodule
          # is fetched in the next step instead of with `submodules: recursive`:
          # the pinned submodule commit carries a nested `droid-gogglepack`
          # gitlink with no .gitmodules entry, and a recursive update aborts on
          # it ("No url found for submodule path ..."), failing every job at
          # checkout.
          submodules: false

      - name: Fetch the schema submodule
        # Non-recursive on purpose: the build embeds
        # ext/droid-lsp/droid-lsp/src/circuits.json and never needs the nested
        # repositories inside the vendored clone.
        run: git submodule update --init ext/droid-lsp

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Formatting and lints are deterministic across targets, so they run once,
      # on the Linux job (design decision 5).
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Rustdoc
        if: runner.os == 'Linux'
        # A broken intra-doc link is how a rename silently rots the docs, so the
        # doc build is a gate like the others.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - name: Tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      # The headless smoke test: it drives the real paint dispatch (both panes,
      # the graph scene, the overlays) and the published hit geometry through the
      # window input path inside a plain egui Context — no window, no GPU, no MIDI
      # device, so it runs on every platform. CI never opens a window, and this is
      # the one step that would catch a pane that stopped publishing its geometry.
      - name: Self-test (headless)
        run: cargo run --release --locked --quiet -- --self-test fixtures/own_buttons.ini

      # The screenshot harness (tools/screenshots) is a separate crate whose
      # build script stages src/gui/mod.rs, so it silently stopped compiling
      # when a new gui surface was added. Build it here rather than discover it
      # a release later.
      - name: Build the screenshot harness
        if: runner.os == 'Linux'
        run: cargo build --manifest-path tools/screenshots/Cargo.toml --locked

      # The perf gate's budgets were calibrated on Linux; tests/perf_gate.rs is
      # cfg-gated to target_os = "linux" (design decision 5).
      - name: Perf gate (release)
        if: runner.os == 'Linux'
        run: cargo test --release --test perf_gate --locked
