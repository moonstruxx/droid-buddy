name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-insta
        run: cargo install cargo-insta --locked

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Tests
        # GENERATE_GALLERY=1 makes the regression gallery hook materialize
        # evidence/gallery/ during the test run (arg form `--generate-gallery`
        # is rejected by libtest as an unknown option).
        run: GENERATE_GALLERY=1 cargo test --locked

      - name: Assert gallery render-outlier flags
        # Fails when the scorer flags nothing: a broken extractor/artifact
        # would produce no `degraded` marker in the generated gallery.
        run: grep -q 'class="degraded"' evidence/gallery/index.html

      - name: Insta strict gate
        run: cargo insta test --check

      - name: Build release
        run: cargo build --release --locked

      - name: Upload visual gallery and pending snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-gallery
          if-no-files-found: warn
          retention-days: 14
          path: |
            evidence/gallery/
            src/snapshots/**/*.snap.new
            src/snapshots/**/*.snap
            **/*.snap.new
