# 3 Body Synths -> VCA -> State Variable Filter -> Stereo Mixer
# I2C from CVM-8 (ch 3,4,5) -> Disting NT -> CV control
# ESX-8CV + ES-5 for 8 CV outputs

# Controllers (adjust to your hardware)
[p2b8]
[b32]

# ============================================================
# I2C INPUT: Poly CV receives I2C from CVM-8 on channels 3, 4, 5
# ============================================================
[pycv]
    I2C channel = 3
    Voices = 1
    Pitch outputs = 1
    Pitch mode = 1
    Gate outputs = 1
    Gate mode = 1
    Apply global tuning = 0
    output = _PYCV_CH3_PITCH

[pycv]
    I2C channel = 4
    Voices = 1
    Pitch outputs = 1
    Pitch mode = 1
    Gate outputs = 1
    Gate mode = 1
    Apply global tuning = 0
    output = _PYCV_CH4_PITCH

[pycv]
    I2C channel = 5
    Voices = 1
    Pitch outputs = 1
    Pitch mode = 1
    Gate outputs = 1
    Gate mode = 1
    Apply global tuning = 0
    output = _PYCV_CH5_PITCH

# ============================================================
# ATTENUVERTERS: Scale/offset I2C pitch CV for VCA/VCF control
# ============================================================
[attn]
    Input = _PYCV_CH3_PITCH
    Scale = 1.0
    Offset = 0
    Gain = 0
    Output mode = 1
    output = _ATTN_CH3

[attn]
    Input = _PYCV_CH4_PITCH
    Scale = 1.0
    Offset = 0
    Gain = 0
    Output mode = 1
    output = _ATTN_CH4

[attn]
    Input = _PYCV_CH5_PITCH
    Scale = 1.0
    Offset = 0
    Gain = 0
    Output mode = 1
    output = _ATTN_CH5

# ============================================================
# VOICE 1: Body Synth 1 -> VCA -> VCF
# ============================================================
[vcam]
    Input = I1              # Body synth 1 audio in
    Clamp to 0V = 1         # CRITICAL: true silence at 0V CV
    Divider = 1
    Output mode = 1
    Zero cross = 0
    output = _VCA1

[fsvf]
    Input = _VCA1
    Frequency input = _ATTN_CH3    # I2C CV controls cutoff
    Resonance input = _ATTN_CH3    # Or separate attenuverter
    Width = 1
    Blend = 100                   # 0=LP, 100=BP, 200=HP
    Sweep = 0
    Resonance = 50
    Saturate = 0
    Blended gain = 0
    Lowpass mode = 1
    Bandpass mode = 1
    Highpass mode = 1
    Blended mode = 1
    output = _VOICE1

# ============================================================
# VOICE 2: Body Synth 2 -> VCA -> VCF
# ============================================================
[vcam]
    Input = I2
    Clamp to 0V = 1
    Divider = 1
    Output mode = 1
    Zero cross = 0
    output = _VCA2

[fsvf]
    Input = _VCA2
    Frequency input = _ATTN_CH4
    Resonance input = _ATTN_CH4
    Width = 1
    Blend = 100
    Sweep = 0
    Resonance = 50
    Saturate = 0
    Blended gain = 0
    Lowpass mode = 1
    Bandpass mode = 1
    Highpass mode = 1
    Blended mode = 1
    output = _VOICE2

# ============================================================
# VOICE 3: Body Synth 3 -> VCA -> VCF
# ============================================================
[vcam]
    Input = I3
    Clamp to 0V = 1
    Divider = 1
    Output mode = 1
    Zero cross = 0
    output = _VCA3

[fsvf]
    Input = _VCA3
    Frequency input = _ATTN_CH5
    Resonance input = _ATTN_CH5
    Width = 1
    Blend = 100
    Sweep = 0
    Resonance = 50
    Saturate = 0
    Blended gain = 0
    Lowpass mode = 1
    Bandpass mode = 1
    Highpass mode = 1
    Blended mode = 1
    output = _VOICE3

# ============================================================
# STEREO MIXER: 3 mono voices -> stereo L/R
# ============================================================
[mix2]
    # Voice 1 -> Channel 1 (Left)
    Input left/mono = _VOICE1
    Gain = 0
    Pan = -50
    Mute = 0
    Solo = 0
    Name = "Voice 1"

    # Voice 2 -> Channel 2 (Center)
    Input left/mono = _VOICE2
    Gain = 0
    Pan = 0
    Mute = 0
    Solo = 0
    Name = "Voice 2"

    # Voice 3 -> Channel 3 (Right)
    Input left/mono = _VOICE3
    Gain = 0
    Pan = 50
    Mute = 0
    Solo = 0
    Name = "Voice 3"

    Output mode = 1
    Output gain = 0
    Destination = 1
    Pre/post = 1
    Width = 1
    output = _MIX_LR

# Output to disting NT main outs
[copy]
    input = _MIX_LR
    output = O1          # Left

[copy]
    input = _MIX_LR
    output = O2          # Right (next bus)

# ============================================================
# ESX-8CV OUTPUTS: Drive 8 CV outs via ES-5 expander
# ============================================================
# Map any internal buses to ESX-8CV hardware outputs
[esx8]
    Expander = 1          # ES-5 header #1
    Adaptive = 1
    1 = _PYCV_CH3_PITCH   # ESX-8CV out 1 = Voice 1 pitch
    2 = _PYCV_CH4_PITCH   # ESX-8CV out 2 = Voice 2 pitch
    3 = _PYCV_CH5_PITCH   # ESX-8CV out 3 = Voice 3 pitch
    4 = _ATTN_CH3         # ESX-8CV out 4 = Voice 1 filter CV
    5 = _ATTN_CH4         # ESX-8CV out 5 = Voice 2 filter CV
    6 = _ATTN_CH5         # ESX-8CV out 6 = Voice 3 filter CV
    7 = _MIX_LR           # ESX-8CV out 7 = Mix L (monitor)
    8 = _MIX_LR           # ESX-8CV out 8 = Mix R (monitor)
