# I2C-controlled Attenuverter + VCA + State Variable Filter + Stereo Mixer
# 
# Hardware: Expert Sleepers CVM-8 (8 CV in/out, I2C + MIDI) → I2C → Disting NT
# Sequencer sends I2C on channels 3, 4, 5 to CVM-8
# CVM-8 forwards to Disting NT via I2C
# 
# Signal flow:
#   3 Body Synth audio → VCA (vcam) → VCF State Variable (fsvf) → Mixer Stereo (mix2) → L/R out
#   I2C (ch 3,4,5) → Poly CV (pycv) → Attenuverter (attn) offset → controls VCA/VCF params

# Controllers
[p2b8]
[b32]          # B3 = 32 buttons for attenuverter control

# ============================================================
# I2C INPUT: Poly CV receives I2C from CVM-8 (channels 3, 4, 5)
# ============================================================
# Voice 1 - I2C channel 3
[pycv]
    I2C channel = 3
    Voices = 1
    Pitch outputs = 1
    Pitch mode = 1          # Replace mode
    Gate outputs = 1
    Gate mode = 1
    Apply global tuning = 0  # Internal use, no global tuning
    output = _PYCV1_PITCH   # Pitch CV for voice 1

# Voice 2 - I2C channel 4
[pycv]
    I2C channel = 4
    Voices = 1
    Pitch outputs = 1
    Pitch mode = 1
    Gate outputs = 1
    Gate mode = 1
    Apply global tuning = 0
    output = _PYCV2_PITCH   # Pitch CV for voice 2

# Voice 3 - I2C channel 5
[pycv]
    I2C channel = 5
    Voices = 1
    Pitch outputs = 1
    Pitch mode = 1
    Gate outputs = 1
    Gate mode = 1
    Apply global tuning = 0
    output = _PYCV3_PITCH   # Pitch CV for voice 3

# ============================================================
# ATTENUVERTERS (B3) - Controlled by I2C via Poly CV
# ============================================================
# Voice 1 attenuverter: pitch CV from pycv → attenuverter offset
[attn]
    Input = _PYCV1_PITCH
    Scale = 1.0
    Offset = 0
    Gain = 0
    Output mode = 1         # Replace
    output = _ATTN1_OUT     # Attenuated CV for voice 1 VCA/VCF

# Voice 2 attenuverter
[attn]
    Input = _PYCV2_PITCH
    Scale = 1.0
    Offset = 0
    Gain = 0
    Output mode = 1
    output = _ATTN2_OUT     # Attenuated CV for voice 2 VCA/VCF

# Voice 3 attenuverter
[attn]
    Input = _PYCV3_PITCH
    Scale = 1.0
    Offset = 0
    Gain = 0
    Output mode = 1
    output = _ATTN3_OUT     # Attenuated CV for voice 3 VCA/VCF

# ============================================================
# VOICE 1: VCA + STATE VARIABLE FILTER
# ============================================================
# Audio input from body synth 1 (e.g., I1 or external)
# VCA: Clamp to 0V = 1 for proper silencing!
[vcam]
    Input = I1              # Body synth 1 audio in
    Clamp to 0V = 1         # CRITICAL: enables true silence at 0V CV
    Divider = 1
    Output mode = 1
    Zero cross = 0
    output = _VCA1_OUT

# State Variable Filter (stereo width = 1 for mono voice)
[fsvf]
    Input = _VCA1_OUT
    Frequency input = _ATTN1_OUT    # I2C-controlled cutoff
    Resonance input = _ATTN1_OUT    # Can use same or separate attenuverter
    Width = 1
    Blend = 100                   # 0=LP, 100=BP, 200=HP
    Sweep = 0
    Resonance = 50
    Saturate = 0
    Blended gain = 0
    Lowpass gain = 0
    Bandpass gain = 0
    Highpass gain = 0
    Lowpass mode = 1
    Bandpass mode = 1
    Highpass mode = 1
    Blended mode = 1
    output = _VOICE1_FILT

# ============================================================
# VOICE 2: VCA + STATE VARIABLE FILTER
# ============================================================
[vcam]
    Input = I2              # Body synth 2 audio in
    Clamp to 0V = 1         # CRITICAL!
    Divider = 1
    Output mode = 1
    Zero cross = 0
    output = _VCA2_OUT

[fsvf]
    Input = _VCA2_OUT
    Frequency input = _ATTN2_OUT
    Resonance input = _ATTN2_OUT
    Width = 1
    Blend = 100
    Sweep = 0
    Resonance = 50
    Saturate = 0
    Blended gain = 0
    Lowpass gain = 0
    Bandpass gain = 0
    Highpass gain = 0
    Lowpass mode = 1
    Bandpass mode = 1
    Highpass mode = 1
    Blended mode = 1
    output = _VOICE2_FILT

# ============================================================
# VOICE 3: VCA + STATE VARIABLE FILTER
# ============================================================
[vcam]
    Input = I3              # Body synth 3 audio in
    Clamp to 0V = 1         # CRITICAL!
    Divider = 1
    Output mode = 1
    Zero cross = 0
    output = _VCA3_OUT

[fsvf]
    Input = _VCA3_OUT
    Frequency input = _ATTN3_OUT
    Resonance input = _ATTN3_OUT
    Width = 1
    Blend = 100
    Sweep = 0
    Resonance = 50
    Saturate = 0
    Blended gain = 0
    Lowpass gain = 0
    Bandpass gain = 0
    Highpass gain = 0
    Lowpass mode = 1
    Bandpass mode = 1
    Highpass mode = 1
    Blended mode = 1
    output = _VOICE3_FILT

# ============================================================
# STEREO MIXER: 3 mono voices → stereo L/R output
# ============================================================
[mix2]
    # Voice 1 → Channel 1
    Input left/mono = _VOICE1_FILT
    Gain = 0
    Pan = -50               # Hard left
    Mute = 0
    Solo = 0
    Name = "Voice 1"

    # Voice 2 → Channel 2
    Input left/mono = _VOICE2_FILT
    Gain = 0
    Pan = 0                 # Center
    Mute = 0
    Solo = 0
    Name = "Voice 2"

    # Voice 3 → Channel 3
    Input left/mono = _VOICE3_FILT
    Gain = 0
    Pan = 50                # Hard right
    Mute = 0
    Solo = 0
    Name = "Voice 3"

    # Output
    Output mode = 1         # Replace
    Output gain = 0
    Destination = 1         # Main output bus
    Pre/post = 1            # Post-fade
    Width = 1               # Stereo send
    output = _MIX_OUT

# Output to physical outputs
[copy]
    input = _MIX_OUT
    output = O1             # Left out

[copy]
    input = _MIX_OUT
    output = O2             # Right out (next bus)

# ============================================================
# B3 BUTTON CONTROL (optional: manual override of attenuverter)
# ============================================================
# B3.1-8 could control per-voice mute/solo via mixer
# B3.9-16 could switch filter modes (LP/BP/HP)
# B3.17-24 could control filter resonance
# B3.25-32 could control VCA gain

# Example: B3.1 mutes Voice 1 in mixer
# [select]
#     select = B3.1
#     input = 1
#     output = _VOICE1_MUTE
#
# [copy]
#     input = _VOICE1_MUTE
#     output = <mix2 channel 1 mute parameter>