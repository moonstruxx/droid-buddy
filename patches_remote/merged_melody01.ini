# Melody sequencer with 3 tracks
# LABELS: master=18
# INPUTS:
#  I1: [CLK In] External clock
#  I2: [RST In] Reset all sequences to step 1 on a gate or trigger here

# OUTPUTS:
#  O1: [V/O 1] Pitch CV output track 1
#  O2: [Velo 1] Modulation CV output track 1
#  O3: [V/O 2] Pitch CV output track 2
#  O4: [Velo 2] Modulation CV output track 2
#  O5: [V/O 3] Pitch CV output track 3
#  O6: [Velo 3] Modulation CV output track 3

# GATES ON MODULE 1:
#  G1.1: [Gate 1] Gate output track 1
#  G1.2: [Gate 2] Gate output track 2
#  G1.3: [Gate 3] Gate output track 3
#  G1.4: [CLK/O] Clock output while running

# GATES ON MODULE 2:
#  G2.1: [RST/O] Reset output

# CONTROLLER 3:
#  B3.1: [Preset A] Ctrl: Switch to preset A, long press: save to preset A
#  B3.2: [Preset B] Ctrl: Switch to preset B, long press: save to preset B
#  B3.3: [Preset C] Ctrl: Switch to preset C, long press: save to preset C
#  B3.4: [Preset D] Ctrl: Switch to preset D, long press: save to preset D
#  B3.5: [CLR] Short press: reset play mode, with CTRL: clear track, long press factory reset
#  B3.6: [INV] Invert the melody (change low to high and vice versa)
#  B3.7: [AAAB] Switch between the song from A, AAAB and AABB
#  B3.8: [CHRO] Disable scale and note selection, allow all 12 notes
#  B3.9: [ARP] Switch this track to arpeggio mode
#  B3.10: [LUCK] Randomly change step buttons, if Ctrl is held, change the gates instead.
#  B3.11: [RST] Reset current track (Ctrl: all track) to step 1 immediately
#  B3.12: [TBR] If enabled, transposes the melody when the root note changes.
#  B3.13: [TON] Tonality menu
#  B3.14: [CLK] Menu for clock speed and swing
#  B3.15: [TRK] Track menu
#  B3.16: [PERF] Performance menu
#  B3.17: [RATC] Number of sub gates per clock
#  B3.18: [REP] Number of repeats, skip steps
#  B3.19: [PAT] Pattern for repeated gates
#  B3.20: [S/E] Set start and end (range of steps to play)
#  B3.21: [RAND] Pitch randomization
#  B3.22: [ACT] Set step activities
#  B3.23: [PROB] Gate probability
#  B3.24: [COPY] Copy current page of current track. With CTRL: Paste
#  B3.25: [NOTE] Set motor faders to pitch
#  B3.26: [VELO] Velocity / Additional gate
#  B3.27: [GL] Gate length and glide
#  B3.28: [START] Start/stop sequencer - start also does reset
#  B3.29: [Track 1] Select track 1
#  B3.30: [Track 2] Select track 2
#  B3.31: [Track 3] Select track 3
#  B3.32: [PAGE] Cycle through the 4 pages of steps

# CONTROLLER 5:
#  P5.1: [RANGE/REPEAT] Arpeggio pitch range / Repeat note shift
#  P5.2: [BASE/RATCH] Arpeggio base pitch / Ratchet note shift
#  B5.1: [ROOT] Allow root note
#  B5.2: [3RD] Allow third note
#  B5.3: [5TH] Allow fifth note
#  B5.4: [7TH] Allow seventh note
#  B5.5: [9TH] Allow nineth note
#  B5.6: [11TH] Allow eleventh note
#  B5.7: [13TH] Allow thirtheenth note
#  B5.8: [CTRL] Switch some of the button functions

[m4]
[m4]
[b32]
[e4]
[p2b8]
[s10]

# -------------------------------------------------
# Envelope constants (shared by all filter / velo env contours)
# -------------------------------------------------

# Sets the max length of the decay on all envelopes in the patch
[copy]
    input = 0.75
    output = _DECAY_MAX

# Sets the max length of the decay on all envelopes in the patch (second copy)
[copy]
    input = 0.75
    output = _DECAY_MAX2

# Sets the min length of the decay on all envelopes in the patch
[copy]
    input = 0.03 + _DECAY_MAX2
    output = _DECAY_MIN

# Sets the max length of the attack on all envelopes in the patch (attack parameter is 1/20 shorter than that of decay, see manual)
[copy]
    input = 15
    output = _ATTACK_MAX

# -------------------------------------------------
# Tonality
# -------------------------------------------------

# Mix together all sources for the root note
[mixer]
    input1 = _ROOT_FADER
    input2 = _MIDI_IN_ROOT_PITCH * 120
    output = _ROOT

# Mix together sources for the scale
[mixer]
    input1 = _DEGREE_FADER
    input2 = _MIDI_IN_SCALE_CC * 127
    output = _DEGREE

# Set the root note (from C, C#, D, ... to C again)
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 97
    fader = 1
    notches = 13
    ledcolor = 1.1
    ledvalue = 1
    output = _ROOT_FADER

# Set the musical scale
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 97
    fader = 2
    notches = 12
    startvalue = 0
    ledcolor = _COLOR_DEGREE_FADER
    ledvalue = 1
    output = _DEGREE_FADER

# Select the color for the scale fader
[multicompare]
    input = _DEGREE_FADER
    compare1 = 0
    ifequal1 = 0.5
    compare2 = 1
    ifequal2 = 0.4
    compare3 = 2
    ifequal3 = 0.73
    compare4 = 6
    ifequal4 = 0.2
    compare5 = 7
    ifequal5 = 1.2
    compare6 = 9
    ifequal6 = 1.1
    else = 0
    output = _COLOR_DEGREE_FADER

# Global octave switch for all tracks
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 97
    fader = 3
    notches = 5
    startvalue = 2
    ledcolor = 0.2
    ledvalue = -0.3
    output = _GLOBAL_OCTAVE_SWITCH
    button = _RESET_OCTAVE_SWITCH
    clear = _RESET_OCTAVE_SWITCH

# Global diatonic transposition for all tracks
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 97
    fader = 4
    notches = 15
    outputoffset = -7
    startvalue = 7
    ledcolor = 0.4
    ledvalue = -0.3
    output = _GLOBAL_NOTESHIFT
    button = _RESET_NOTESHIFT
    clear = _RESET_NOTESHIFT
    header = "DIATONIC TRANSPOSE"

# Prevent the pitch to change between clock ticks
[sample]
    input = _GLOBAL_NOTESHIFT
    sample = _CLOCK
    output = _GLOBAL_NOTESHIFT_CLOCKED

# Global transposition by semitones for all tracks
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 97
    fader = 5
    notches = 25
    startvalue = 12
    outputoffset = -12
    ledcolor = 0.85
    ledvalue = -0.3
    output = _GLOBAL_TRANSPOSITION
    button = _RESET_TRANSPOSITION
    clear = _RESET_TRANSPOSITION
    header = "TRANSPOSITION"

# Global transposition by semitones for all tracks
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 97
    fader = 6
    notches = 3
    startvalue = 0
    ledcolor = 0
    ledvalue = _TUNING_LED + 0.3
    output = _TUNING_COMPOSE
    display = 0

# Make tuning mode or compose mode active depending on the fader position.
[switch]
    input1 = 1
    offset = _TUNING_COMPOSE
    output2 = _COMPOSEMODE
    output3 = _TUNINGMODE

# Let the LED blink so that we are aware of the special mode
[lfo]
    hz = 5
    level = 0.7 * _TUNING_COMPOSE
    square = _TUNING_LED

# Glide length (duration of slides)
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 97
    fader = 7
    startvalue = 0.3
    ledcolor = 0.5
    ledvalue = 1
    output = _T1_GLIDE_LENGTH_FADER
    header = "GLIDE DURATION"

# Make glide reasonably fast, make fader curve zoomed in in the short glide times.
[math]
    input1 = _T1_GLIDE_LENGTH_FADER * 0.5
    input2 = 3
    power = _T1_GLIDE_LENGTH

# Set the CV range for track 1
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 97
    fader = 8
    notches = 6
    startvalue = 1
    ledcolor = 0.65
    ledvalue = _TUNING_LED + 0.3
    outputoffset = 1
    output = _T1_CVRANGE
    header = "Range (octaves)"

# Glide length (duration of slides)
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 194
    fader = 7
    startvalue = 0.3
    ledcolor = 0.5
    ledvalue = 1
    output = _T2_GLIDE_LENGTH_FADER
    header = "GLIDE DURATION"

# Make glide reasonably fast, make fader curve zoomed in in the short glide times.
[math]
    input1 = _T2_GLIDE_LENGTH_FADER * 0.5
    input2 = 3
    power = _T2_GLIDE_LENGTH

# Set the CV range for track 2
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 194
    fader = 8
    notches = 6
    startvalue = 1
    ledcolor = 0.65
    ledvalue = _TUNING_LED + 0.3
    outputoffset = 1
    output = _T2_CVRANGE
    header = "Range (octaves)"

# Glide length (duration of slides)
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 291
    fader = 7
    startvalue = 0.3
    ledcolor = 0.5
    ledvalue = 1
    output = _T3_GLIDE_LENGTH_FADER
    header = "GLIDE DURATION"

# Make glide reasonably fast, make fader curve zoomed in in the short glide times.
[math]
    input1 = _T3_GLIDE_LENGTH_FADER * 0.5
    input2 = 3
    power = _T3_GLIDE_LENGTH

# Set the CV range for track 3
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 291
    fader = 8
    notches = 6
    startvalue = 1
    ledcolor = 0.65
    ledvalue = _TUNING_LED + 0.3
    outputoffset = 1
    output = _T3_CVRANGE
    header = "Range (octaves)"

# -------------------------------------------------
# setup
# -------------------------------------------------

[droid]
    ledbrightness = 1
    maxslope1 = 0.25
    maxslope2 = 0.25
    maxslope3 = 0.25
    maxslope4 = 0.25
    maxslope5 = 0.25
    maxslope6 = 0.25
    maxslope7 = 0.25
    maxslope8 = 0.25
    lpfilter1 = 0.25
    lpfilter2 = 0.25
    lpfilter3 = 0.25
    lpfilter4 = 0.25
    lpfilter5 = 0.25
    lpfilter6 = 0.25
    lpfilter7 = 0.25
    lpfilter8 = 0.25
    m4touchgain1 = 0.75
    m4touchgain2 = 0.75
    m4touchgain3 = 0.75
    m4touchgain4 = 0.75

# -------------------------------------------------
# MIDI input
# -------------------------------------------------

# MIDI input for clock, start and stop
[midiin]
    trs = 1
    usb = 0
    start = _EXT_RUNNING_STARTED
    stop = _EXT_RUNNING_STOPPED
    clock = _MIDI_INPUT_CLOCK
    running = _RUNNING_EXT

# Detect a MIDI input clock signal if within the last 2 seconds there is a pulse
[gatetool]
    inputtrigger = _MIDI_INPUT_CLOCK
    gatelength = 2
    outputgate = _MIDI_INPUT_CLOCK_PRESENT

# Get root and scale via MIDI
[midiin]
    trs = 2
    pitch1 = _MIDI_IN_ROOT_PITCH
    ccnumber1 = 1
    cc1 = _MIDI_IN_SCALE_CC

# Keyboard input: play the sequencer notes live on MIDI channel 7
[midiin]
    channel = 7
    voiceallocation = 0
    ccnumber1 = 0
    ccnumber2 = 0
    pitch1 = _KEYBOARD_IN_PITCH
    gate1 = _KEYBOARD_IN_GATE

# MIDI through: pass MIDI from TRS to TRS (passes clock/start/stop to downstream gear)
[midithrough]
    fromtrs = 1
    totrs = 2
    fromusb = 0

# -------------------------------------------------
# Clocking
# -------------------------------------------------

# Selects 100s of BPM
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 99
    fader = 1
    notches = 3
    output = _CLOCK_BPM_100
    startvalue = 1
    ledcolor = 0.2
    ledvalue = 1
    display = 0

# Selects 10s of BPM
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 99
    fader = 2
    notches = 10
    output = _CLOCK_BPM_10
    startvalue = 2
    ledcolor = 0.2
    ledvalue = 1
    display = 0

# Selects 1s of BPM
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 99
    fader = 3
    notches = 10
    output = _CLOCK_BPM_1
    startvalue = 0
    ledcolor = 0.2
    ledvalue = 1
    display = 0

# Clock bend half speed / double speed. Touch button to reset.
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 99
    fader = 4
    output = _CLOCK_BEND_FADER
    startvalue = 0.5
    ledcolor = _CLOCK_BEND_COLOR
    ledvalue = 1
    button = _RESET_CLOCK_BEND
    clear = _RESET_CLOCK_BEND
    display = 0

# Snap to the perfectly neutral position if the fader is almost there.
[pot]
    pot = _CLOCK_BEND_FADER
    notch = 0.01
    output = _CLOCK_BEND
    display = 0

# Let the LED light bright if the bending alteration is exactly zero.
[ifequal]
    input1 = _CLOCK_BEND
    input2 = 0.5
    ifequal = 0.4
    else = 0.8
    output = _CLOCK_BEND_COLOR

# Add up all three BPM faders
[mixer]
    input1 = _CLOCK_BPM_100 * 100
    input2 = _CLOCK_BPM_10 * 10
    input3 = _CLOCK_BPM_1
    output = _CLOCK_BPM_THREE_FADERS

# Clock swing (shuffle)
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 99
    fader = 5
    output = _CLOCK_SWING
    ledcolor = 1.1
    ledvalue = _CLOCK_SWING * 0.9 + 0.1
    header = "SWING"

# Small hack for letting the user toggle the state with the touch button
[switch]
    input1 = _INT_CLOCK_UNMUTED
    input2 = 0
    offset = B3.5
    output1 = _CLOCK_MUTE_STARTVALUE

# Mute the clock, switch to external clocks if present. Touch button to toggle.
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 99
    fader = 6
    notches = 2
    output = _INT_CLOCK_UNMUTED
    button = _TOGGLE_CLOCK_MUTE
    clear = _TOGGLE_CLOCK_MUTE
    startvalue = -1 * _CLOCK_MUTE_STARTVALUE + 1
    ledcolor = _INT_CLOCK_UNMUTED * -0.4 + 0.8
    ledvalue = 1

# Disable this unused fader
[unusedfaders]
    select = _GLOBAL_FADER_SELECTION
    selectat = 99
    firstfader = 7

# Range of pitch accumulator
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 99
    fader = 8
    startvalue = 3
    notches = 17
    ledcolor = 1.2
    ledvalue = 1
    output = _T1_ACCU_RANGE
    header = "ACCU CYCLES"

# Range of pitch accumulator
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 198
    fader = 8
    startvalue = 3
    notches = 17
    ledcolor = 1.2
    ledvalue = 1
    output = _T2_ACCU_RANGE
    header = "ACCU CYCLES"

# Range of pitch accumulator
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 297
    fader = 8
    startvalue = 3
    notches = 17
    ledcolor = 1.2
    ledvalue = 1
    output = _T3_ACCU_RANGE
    header = "ACCU CYCLES"

# Split clock bending fader in two hemispheres, so the the lower one is linear and can go to
# 0 Hz, while the upper half is going to exactly double speed.
[pot]
    pot = _CLOCK_BEND
    lefthalfinv = _CLOCK_BEND_LINEAR
    righthalf = _CLOCK_BEND_EXP

[math]
    input1 = 2
    input2 = _CLOCK_BEND_EXP
    power = _CLOCK_BEND_FACTOR

[copy]
    input = _CLOCK_BPM_THREE_FADERS * _CLOCK_BEND_LINEAR
    output = _CLOCK_BPM_LINEAR

[copy]
    input = _CLOCK_BPM_LINEAR * _CLOCK_BEND_FACTOR
    output = _CLOCK_BPM_UNMUTED

# Set the BPM to zero while the clock is muted.
[copy]
    input = _CLOCK_BPM_UNMUTED * _INT_CLOCK_UNMUTED
    output = _CLOCK_BPM

# The actual clock, use a very short pulse so we have essentially just triggers
[lfo]
    hz = _CLOCK_BPM / 15
    pulsewidth = 0.1
    square = _INT_CLOCK
    sync = _RUNNING

# Detect an external clock signal, if within the last 2 seconds there was a trigger
[gatetool]
    inputtrigger = I1
    gatelength = 2
    outputgate = _EXTERNAL_CLOCK_PRESENT

# Select first avaiable clock in defined precedence order
[case]
    case1 = _MIDI_INPUT_CLOCK_PRESENT
    value1 = _MIDI_INPUT_CLOCK
    case2 = _INT_CLOCK_UNMUTED
    value2 = _INT_CLOCK
    case3 = _EXTERNAL_CLOCK_PRESENT
    value3 = I1
    output = _CLOCK_UNSWUNG

# Apply swing to the clock
[timing]
    clock = _CLOCK_UNSWUNG
    reset = _RESET
    timing1 = 0
    timing2 = _CLOCK_SWING * 0.33
    output = _CLOCK

# Pulses for changes via lucky buttons / lucky faders
[lfo]
    hz = 40
    square = _LUCKY_CLOCK

# Clock division 3/2 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_3_2
    multiply = 3
    divide = 2

# Clock division 2/1 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_2_1
    multiply = 2
    divide = 1

# Clock division 3/1 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_3_1
    multiply = 3
    divide = 1

# Clock division 4/1 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_4_1
    multiply = 4
    divide = 1

# Clock division 6/1 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_6_1
    multiply = 6
    divide = 1

# Clock division 8/1 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_8_1
    multiply = 8
    divide = 1

# -------------------------------------------------
# Global buttons
# -------------------------------------------------

# A long press on the clear button resets all settings of the sequencer to its default state
[button]
    button = B3.5
    states = 1
    longpress = _FACTORY_RESET

# Do the factory reset
[droid]
    clearall = _FACTORY_RESET

# Animation of track buttons when muted.
[lfo]
    level = 0.8
    bipolar = 0
    square = _MUTE_BLINK
    pulsewidth = 0.2
    hz = 2.5

# Mute button for track 1 (same as track button)
[button]
    select = _CONTROL
    button = B3.29
    led = L3.29
    output = _T1_MUTED

# Compute state of track LED based on wether it is selected and/or muted
[switch]
    offset = _T1_SELECTED * 2 + _T1_MUTED
    input1 = 0
    input2 = _MUTE_BLINK
    input3 = 1
    input4 = -1 * _MUTE_BLINK + 1
    output1 = _T1_TRACKLED

# Show mute state of track while CTRL is held
[ifequal]
    input1 = _CONTROL
    input2 = 1
    ifequal = _T1_MUTED
    else = _T1_TRACKLED
    output = L3.29

# Mute button for track 2 (same as track button)
[button]
    select = _CONTROL
    button = B3.30
    led = L3.30
    output = _T2_MUTED

# Compute state of track LED based on wether it is selected and/or muted
[switch]
    offset = _T2_SELECTED * 2 + _T2_MUTED
    input1 = 0
    input2 = _MUTE_BLINK
    input3 = 1
    input4 = -1 * _MUTE_BLINK + 1
    output1 = _T2_TRACKLED

# Show mute state of track while CTRL is held
[ifequal]
    input1 = _CONTROL
    input2 = 1
    ifequal = _T2_MUTED
    else = _T2_TRACKLED
    output = L3.30

# Mute button for track 3 (same as track button)
[button]
    select = _CONTROL
    button = B3.31
    led = L3.31
    output = _T3_MUTED

# Compute state of track LED based on wether it is selected and/or muted
[switch]
    offset = _T3_SELECTED * 2 + _T3_MUTED
    input1 = 0
    input2 = _MUTE_BLINK
    input3 = 1
    input4 = -1 * _MUTE_BLINK + 1
    output1 = _T3_TRACKLED

# Show mute state of track while CTRL is held
[ifequal]
    input1 = _CONTROL
    input2 = 1
    ifequal = _T3_MUTED
    else = _T3_TRACKLED
    output = L3.31

# Track selection
[buttongroup]
    header = "TRACK"
    output = _SELECTED_TRACK
    select = _NO_CONTROL
    extrapress = _TRACK_EXTRA_PRESS
    button1 = B3.29
    value1 = 1
    led1 = _T1_SELECTED
    button2 = B3.30
    value2 = 2
    led2 = _T2_SELECTED
    button3 = B3.31
    value3 = 3
    led3 = _T3_SELECTED

# -------------------------------------------------
# Special menus
# -------------------------------------------------

# Select a global menu function of the faders. There is no button for "normal" in order to save
# buttons. Simply press the currently lit button to deactivate all menu buttons and go back
# to controlling the sequence.
[buttongroup]
    button1 = B3.13
    led1 = L3.13
    value1 = 97
    button2 = B3.14
    led2 = L3.14
    value2 = 99
    button3 = B3.15
    led3 = L3.15
    value3 = _SELECTED_TRACK + 10
    button4 = B3.16
    led4 = L3.16
    value4 = 98
    clear = _FADERMODE_CHANGED
    display = 0
    startbutton = 0
    minactive = 0
    maxactive = 1
    output = _GLOBAL_MENU

# If there is no menu active, the fader edit the sequence of the currently selected track.
[ifequal]
    input1 = _GLOBAL_MENU
    input2 = 0
    ifequal = _SELECTED_TRACK
    else = _GLOBAL_MENU
    output = _GLOBAL_FADER_SELECTION

# LFO for blinking the ARP LED while it is in Autostop mode
[lfo]
    hz = 2.5
    bipolar = 0
    level = -0.8
    square = _ARP_AUTOSTOP_BLINK

# Provide state of the control button in a patch cable.
[copy]
    input = B5.8
    output = _CONTROL

# Inverted state of control button, is 1 of not held.
[copy]
    input = -1 * B5.8 + 1
    output = _NO_CONTROL

# Select the current mode of the faders for the sequencer
[buttongroup]
    button1 = B3.25
    led1 = L3.25
    value1 = 0
    button2 = B3.26
    led2 = L3.26
    value2 = 10
    button3 = B3.18
    led3 = L3.18
    value3 = 3
    button4 = B3.19
    led4 = L3.19
    value4 = 4
    button5 = B3.21
    led5 = L3.21
    value5 = 1
    button6 = B3.27
    led6 = L3.27
    value6 = 20
    button7 = B3.17
    led7 = L3.17
    value7 = 5
    button8 = B3.23
    led8 = L3.23
    value8 = 2
    button9 = B3.22
    led9 = L3.22
    value9 = 30
    button10 = S6.8
#   led10 = L6.8
    value10 = 40
    display = 0
    buttonpress = _FADERMODE_CHANGED
    output = _FADERMODE

# Envelope setup buttons (re-homed from mpfs5's B3.27/B3.28 which are START/GL in this patch):
# hold the VELO button (B3.27) to show the velo envelope controls - replaced by S6.9 switch
[button]
    button = S6.9
    states = 1
    onvalue = 1
    offvalue = 0
    output = _ENV_VELO_BUTTON_HOLD

# hold the FCV button (B3.28) to show the filter envelope controls - replaced by S6.10 switch
[button]
    button = S6.10
    states = 1
    onvalue = 1
    offvalue = 0
    output = _ENV_FCV_BUTTON_HOLD

# NOTE button hold: entering note fader mode (used to detect overlay activity)
[button]
    button = B3.25
    states = 1
    onvalue = 1
    offvalue = 0
    output = _NOTE_BUTTON_HOLD

# Env setup is active when either the velo or the fcv envelope button is held
[mixer]
    input1 = _ENV_VELO_BUTTON_HOLD
    input2 = _ENV_FCV_BUTTON_HOLD
    output = _ENV_SETUP_ACTIVE

[logic]
    input1 = _ENV_SETUP_ACTIVE
#   negated = _NO_SETUP_ACTIVE

# -------------------------------------------------
# Perf menu (S6.1 switch selects the menu page)
# -------------------------------------------------

[switch]
    input1 = 1
    input2 = 2
    input3 = 3
    input4 = 4
    input5 = 5
    input6 = 6
    input7 = 7
    input8 = 8
    offset = S6.1
    output1 = _PERF_MENU_SELECT

# Perf overlay is active when none of the envelope buttons is held
[logic]
    nor = _NO_PERFORMANCE_OVERLAY_ACT
    input1 = _NOTE_BUTTON_HOLD
    input2 = _ENV_VELO_BUTTON_HOLD
    input3 = _ENV_FCV_BUTTON_HOLD

# Select a button mode that is most useful in the current fader mode
#
# Select a button mode that is most useful in the current fader mode
[multicompare]
    input = _FADERMODE
    compare1 = 3
    ifequal1 = 3
    compare2 = 4
    ifequal2 = 2
    else = 0
    output = _BM
    compare3 = 20
    ifequal3 = 20

# When the range button is active, it always has precedence
[ifequal]
    input1 = _RANGE
    input2 = 0
    ifequal = _BM
    else = 1
    output = _BUTTONMODE

# Button for choosing between gates on/off and start/end
[button]
    button = B3.20
    led = L3.20
    states = 1
    output = _RANGE

# Button for reseting all tracks to step 1
[button]
    button = B3.11 * _CONTROL
    led = L3.11
    states = 1
    output = _RESET_BUTTON

# Combine all source of global reset
[mixer]
    input1 = _RESET_BUTTON
    input2 = I2
    input3 = _STARTSTOP_RESET
    input4 = _EXT_RUNNING_STARTED
    output = _RESET

# Button for run/stop
[button]
    led = L3.28
    output = _RUNNING
    button = B3.28 + _EXT_RUNNING_STARTED
    startvalue = _RUNNING_EXT
    clear = _EXT_RUNNING_STOPPED

# Create a reset trigger when the button changes to 'running'
[gatetool]
    inputgate = _RUNNING
    outputtrigger = _STARTSTOP_RESET

# Button for selecting the second page of steps
[button]
    button = B3.32 + _TRACK_EXTRA_PRESS
    led = L3.32
    output = _PAGE
    states = 4

# Extended lucky system
[button]
    button = S6.2
    states = 1
    onvalue = 1
    offvalue = 0
    output = _LUCKY_MODE
    negated = _NO_LUCKY

# Select which lucky parameter the faders edit (B5.1-5.7, dual-use with note selection)
[buttongroup]
    button1 = B5.1
    button2 = B5.2
    button3 = B5.3
    button4 = B5.4
    button5 = B5.5
    button6 = B5.6
    button7 = B5.7
    minactive = 0
    maxactive = 1
    select = _LUCKY_MODE
    led1 = _LUCKY_CVS
    led2 = _LUCKY_SPREAD
    led3 = _LUCKY_DRIFT
    led4 = _LUCKY_RAND
    led5 = _LUCKY_RATC
    led6 = _LUCKY_REPEAT
    led7 = _LUCKY_GATES

# Lucky scope: which page (S1-S4) of lucky parameters is currently edited
[buttongroup]
    button1 = S6.3
    button2 = S6.4
    button3 = S6.5
    button4 = S6.7
    value1 = 0
    value2 = 1
    value3 = 2
    value4 = 3
#   led1 = L6.3
#   led2 = L6.4
#   led3 = L6.5
#   led4 = L6.7
    output = _LUCKY_SCOPE
    select = _LUCKY_MODE

# Map the current fader mode to the lucky sequence address (which motoquencer page)
[multicompare]
    input = _FADERMODE
    compare1 = 10
    ifequal1 = 1
    compare2 = 20
    ifequal2 = 2
    else = 0
    output = _LUCKY_SEQ_ADDRESS
    compare3 = 30
    ifequal3 = 3
    compare4 = 40
    ifequal4 = 4

# Fan out the lucky CV type (CVS/DRIFT/SPREAD/RAND) to the four sequence pages
[switch]
    input1 = _LUCKY_CVS
    input2 = _LUCKY_DRIFT
    input3 = _LUCKY_SPREAD
    input4 = _LUCKY_RAND
    offset = _LUCKY_SEQ_ADDRESS * -4
    output1 = _LUCKY_CVS_S1
    output2 = _LUCKY_DRIFT_S1
    output3 = _LUCKY_SPREAD_S1
    output4 = _LUCKY_RAND_S1
    output5 = _LUCKY_CVS_S2
    output6 = _LUCKY_DRIFT_S2
    output7 = _LUCKY_SPREAD_S2
    output8 = _LUCKY_RAND_S2
    output9 = _LUCKY_CVS_S3
    output10 = _LUCKY_DRIFT_S3
    output11 = _LUCKY_SPREAD_S3
    output12 = _LUCKY_RAND_S3
    output13 = _LUCKY_CVS_S4
    output14 = _LUCKY_DRIFT_S4
    output15 = _LUCKY_SPREAD_S4
    output16 = _LUCKY_RAND_S4

# Fan out the lucky gate type (RATC/REPEAT/GATES/TIES) to the four sequence pages
[switch]
    input1 = _LUCKY_RATC
    input2 = _LUCKY_REPEAT
    input3 = _LUCKY_GATES
    offset = _LUCKY_SEQ_ADDRESS * -4
    output1 = _LUCKY_RATC_S1
    output2 = _LUCKY_REPEAT_S1
    output3 = _LUCKY_GATES_S1
    output4 = _LUCKY_TIES_S1
    output5 = _LUCKY_RATC_S2
    output6 = _LUCKY_REPEAT_S2
    output7 = _LUCKY_GATES_S2
    output8 = _LUCKY_TIES_S2
    output9 = _LUCKY_RATC_S3
    output10 = _LUCKY_REPEAT_S3
    output11 = _LUCKY_GATES_S3
    output12 = _LUCKY_TIES_S3
    output13 = _LUCKY_RATC_S4
    output14 = _LUCKY_REPEAT_S4
    output15 = _LUCKY_GATES_S4
    output16 = _LUCKY_TIES_S4

# -------------------------------------------------
# Track 1
# -------------------------------------------------

# Provide trigger when the clear button is pressed (no Ctrl needed)
[button]
    select = _SELECTED_TRACK
    selectat = 1
    button = B3.5
    shortpress = _T1_CLEAR_BUTTON
    states = 1

# Clear button with control together clears the track
[copy]
    input = _T1_CLEAR_BUTTON * _CONTROL
    output = _T1_CLEAR

# Clear button without control removes all mode that alter the pattern length
[logic]
    input1 = _T1_CLEAR_BUTTON
    input2 = -1 * _CONTROL + 1
    and = _T1_PEACE

# Five blinks for the clear LED
[burst]
    trigger = _T1_CLEAR + _FACTORY_RESET
    hz = 5
    count = 5
    output = _T1_CLEAR_LED

# LED only blinks when track is selected
[select]
    select = _SELECTED_TRACK
    selectat = 1
    input = _T1_CLEAR_LED + 0.3
    output = L3.5

# Reset track immediately
[button]
    select = _SELECTED_TRACK
    selectat = 1
    button = B3.11 * _NO_CONTROL
    states = 1
    output = _T1_RESET

# Button for copy and paste
[button]
    select = _SELECTED_TRACK
    selectat = 1
    button = B3.24
    states = 1
    output = _T1_COPY_BUTTON

# This button cycles between the song froms A, AAAB and AABB
[button]
    select = _SELECTED_TRACK
    selectat = 1
    clear = _T1_CLEAR
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    button = B3.7
    led = L3.7
    output = _T1_FORM
    states = 3

# Disables scale and note selection if on
[button]
    select = _SELECTED_TRACK
    selectat = 1
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    button = B3.8
    led = L3.8
    output = _T1_12TONE

# Enable transposing the melody by the difference of the root note to C
[button]
    select = _SELECTED_TRACK
    selectat = 1
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    button = B3.12
    led = L3.12
    output = _T1_TBR_ON
    inverted = _T1_TBR_OFF

# Provide the amount of 'transpose by root' in a patch cable
[ifequal]
    input1 = _T1_TBR_ON
    input2 = 1
    ifequal = _ROOT / 120
    output = _T1_TBR

# Hold to contiously step faders to random positions, hold with Ctrl to change buttons
[button]
    select = _SELECTED_TRACK
    selectat = 1
    button = B3.10
    states = 1
    onvalue = _LUCKY_CLOCK
    output = _T1_LUCKY

# Selects melodic inversion (swap low and high notes)
[button]
    select = _SELECTED_TRACK
    selectat = 1
    clear = _T1_CLEAR
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    button = B3.6
    led = L3.6
    output = _T1_INVERT

# Combine all triggers for clearing
[mixer]
    input1 = _T1_CLEAR + _T1_PEACE
    input2 = _T1_BPAR_1 + _T1_BPAR_2
    output = _T1_CLEAR_PAR

# Reset track after X clock ticks
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T1_ARP_OFF
    selectat = 11
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    notches = 17
    startvalue = 0
    ledcolor = 0.8
    ledvalue = -0.3
    clear = _T1_CLEAR_PAR
    sharewithnext = 1
    fader = 1
    button = _T1_BPAR_1

# Reset track after X clock ticks
[motorfader]
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    notches = 17
    startvalue = 0
    ledcolor = 0.8
    ledvalue = -0.3
    clear = _T1_CLEAR_PAR
    select = _GLOBAL_FADER_SELECTION
