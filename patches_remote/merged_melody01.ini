    selectat = 1
    button = B3.9
    clear = _T1_START_OF_SEQUENCE * _T1_ARP_AUTOSTOP
    output = _T1_ARP
    negated = _T1_ARP_OFF

# The LED of the ARP button blinks when it is on but in Autostop mode
[select]
