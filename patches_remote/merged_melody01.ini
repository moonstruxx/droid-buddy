# Select the multiplier based on the fader position
[switch]
    input1 = 1
    input2 = 1
    input3 = 1
    input4 = 1
    input5 = 2
    input6 = 4
    input7 = 8
    offset = _T2_CD_EVEN
    output1 = _T2_CD_EVEN_MULT

# Select the division based on the fader position
[switch]
    input1 = 8
    input2 = 4
    input3 = 2
    input4 = 1
    input5 = 1
    input6 = 1
    input7 = 1
    offset = _T2_CD_EVEN
    output1 = _T2_CD_EVEN_DIV

# Combine all triggers for clearing
[mixer]
    input1 = _T2_CLEAR
    input2 = _T2_BPCDODD_1
    output = _T2_CLEAR_PCDODD

# Clock division for odd divides/multipliers
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T2_ARP_OFF
    selectat = 12
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    notches = 7
    startvalue = 3
    ledcolor = 1.2
    ledvalue = -0.3
    clear = _T2_CLEAR_PCDODD
    output = _T2_CD_ODD
    fader = 8
    button = _T2_BPCDODD_1

# Select the multiplier based on the fader position
[switch]
    input1 = 1
    input2 = 1
    input3 = 1
    input4 = 1
    input5 = 3
    input6 = 5
    input7 = 7
    offset = _T2_CD_ODD
    output1 = _T2_CD_ODD_MULT

# Select the division based on the fader position
[switch]
    input1 = 7
    input2 = 5
    input3 = 3
    input4 = 1
    input5 = 1
    input6 = 1
    input7 = 1
    offset = _T2_CD_ODD
    output1 = _T2_CD_ODD_DIV

# Switch on/off arpeggio mode for track 2
[button]
    select = _SELECTED_TRACK
    selectat = 2
    button = B3.9
    clear = _T2_START_OF_SEQUENCE * _T2_ARP_AUTOSTOP
    output = _T2_ARP
    negated = _T2_ARP_OFF

# The LED of the ARP button blinks when it is on but in Autostop mode
[select]
    select = _SELECTED_TRACK
    selectat = 2
    input = _T2_ARP_AUTOSTOP * _ARP_AUTOSTOP_BLINK + _T2_ARP
    output = L3.9

# Autostop mode for ARP: When you hold CTRL while switching ARP on, it will automatically switch
# off the next time the sequence starts. This allows for easier jamming the ARP for doing fills.
[flipflop]
    set = B3.9 * _CONTROL
    reset = _T2_ARP_OFF
    output = _T2_ARP_AUTOSTOP

# Sync switching ARP on/off with clock in order to avoid audible glitches
[sample]
    input = _T2_ARP
    sample = _T2_CLOCK
    output = _T2_ARP_SYNCED

# Auto reset arpeggiator after N number of steps
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T2_ARP
    selectat = 12
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    fader = 1
    notches = 17
    ledcolor = 0.8
    ledvalue = 1
    output = _T2_ARP_AUTORESET
    header = "AUTORESET"

# Enable ping pong mode
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T2_ARP
    selectat = 12
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    fader = 2
    notches = 3
    ledcolor = 0.85
    ledvalue = 1
    output = _T2_ARP_DIRECTION

# Provide gate for reversed direction of arpeggio
[ifequal]
    input1 = _T2_ARP_DIRECTION
    input2 = 2
    ifequal = 1
    else = 0
    output = _T2_ARP_UPDOWN

# Provide gate for ping pong of arpeggio
[ifequal]
    input1 = _T2_ARP_DIRECTION
    input2 = 1
    ifequal = 1
    else = 0
    output = _T2_ARP_PINGPONG

# Seperate octave switch for the arpeggio
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T2_ARP
    selectat = 12
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    fader = 3
    notches = 5
    ledcolor = 0.2
    startvalue = 2
