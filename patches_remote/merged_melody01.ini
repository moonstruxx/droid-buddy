    luckyrepeats = _LUCKY_REPEAT_S4 * _T3_SELECTED
    luckyspread = _LUCKY_SPREAD_S4 * _T3_SELECTED
    luckyties = _LUCKY_TIES_S4 * _T3_SELECTED
    cv = _T3_FILTER_CV
    cvbase = _T3_FILTER_VOLTAGE_MIN
    cvrange = _T3_FILTER_VOLTAGE_MAX
    defaultcv = _T3_FILTER_VOLTAGE_MAX * 0.5
    quantize = 0
    cvname = "Filter CV"
    bulkedit = _CONTROL

# Silence the gate if the step does not reach the required activity
[compare]
    input = _T3_STEP_ACTIVITY
    compare = _T3_ACTIVITY
    ifless = 0
    else = _T3_SEQUENCER_GATE
    output = _T3_ACT_GATE

# Modulate gate length for gate output in arpeggiator mode
[gatetool]
    taptempo = _T3_ARP_TAPTEMPO
    gatelength = _T3_GATELENGTH
    inputgate = _T3_ARP_CLOCK
    outputgate = _T3_ARP_MODULATED_GATE

# Switch gate to arpeggiator if active
[ifequal]
    input1 = _T3_ARP_SYNCED
    input2 = 0
    ifequal = _T3_ACT_GATE
    else = _T3_ARP_MODULATED_GATE
    output = _T3_SWITCHED_GATE

# Logic for make the gate silent if the track is muted
[logic]
    input1 = -1 * _T3_MUTED + 1
    input2 = _T3_SWITCHED_GATE
    and = _T3_MUTED_GATE

# Select clock for arpeggiator of track 3. It is either the master clock or a multiplication
# of it, or the sequencer gate output.
[switch]
    input1 = _CLOCK
    input2 = _T3_SEQUENCER_GATE
    input3 = _CLOCK_3_2
    input4 = _CLOCK_2_1
    input5 = _CLOCK_3_1
    input6 = _CLOCK_4_1
    input7 = _CLOCK_6_1
    input8 = _CLOCK_8_1
    output1 = _T3_ARP_CLOCK
    offset = _T3_ARP_CLOCKING

# Create taptempo for arp clock to be used for gate length
[switch]
    input1 = _CLOCK
    input2 = _T3_CLOCK
    input3 = _CLOCK_3_2
    input4 = _CLOCK_2_1
    input5 = _CLOCK_3_1
    input6 = _CLOCK_4_1
    input7 = _CLOCK_6_1
    input8 = _CLOCK_8_1
    output1 = _T3_ARP_TAPTEMPO
    offset = _T3_ARP_CLOCKING * _T3_ARP

# Virtual pot for base pitch of arpeggiator
[pot]
    select = _T3_ARP * 100 + _SELECTED_TRACK
    selectat = 103
    pot = P5.2
    outputscale = 36
    output = _T3_ARP_PITCH

# Virtual pot for pitch range of arpeggiator
[pot]
    select = _T3_ARP * 100 + _SELECTED_TRACK
    selectat = 103
    pot = P5.1
    outputscale = 48
    output = _T3_ARP_RANGE

# Arpeggiator for track 3
[arpeggio]
    select1 = _T3_SEL_1
    select3 = _T3_SEL_2
    select5 = _T3_SEL_3
    select7 = _T3_SEL_4
    select9 = _T3_SEL_5
    select11 = _T3_SEL_6
    select13 = _T3_SEL_7
    selectfill1 = 0
    selectfill2 = 0
    selectfill3 = 0
    selectfill4 = 0
    selectfill5 = 0
    root = _ROOT * _T3_TBR_OFF
    transpose = _T3_TBR
    degree = _DEGREE
    clock = _T3_ARP_CLOCK * _RUNNING
    reset = _RESET
    tuningmode = _TUNINGMODE
    direction = _T3_ARP_UPDOWN
    pingpong = _T3_ARP_PINGPONG
    butterfly = _T3_ARP_BUTTERFLY
    octaves = _T3_ARP_OCTAVING
    drop = _T3_ARP_DROP
    pattern = _T3_ARP_PATTERN
    autoreset = _T3_ARP_AUTORESET
    pitch = _T3_ARP_PITCH / 120
    range = _T3_ARP_RANGE / 120
    output = _T3_ARP_OUTPUT

# Switch pitch output between sequencer and arpeggiator
[ifequal]
    input1 = _T3_ARP_SYNCED
    input2 = 0
    ifequal = _T3_PITCH
    else = _T3_ARP_OUTPUT + _T3_ARP_OCTAVE
    output = _T3_SWITCHED_PITCH

# Mix all sources of pitch together
[mixer]
    input1 = _T3_OCTAVE * 1V - 2V
    input2 = _T3_SWITCHED_PITCH
    input3 = _GLOBAL_OCTAVE_SWITCH * 1V - 2V
    input4 = _GLOBAL_TRANSPOSITION * 0.00833333
    output = _T3_FINAL_PITCH

# Slew limiter for glides
[slew]
    input = _T3_FINAL_PITCH
    exponential = O5
    slew = _T3_GLIDE * _T3_GLIDE_LENGTH

# If we are in compose mode and the arpeggiator is switched off, the gate is output even if
# the sequencer is stopped.
[ifequal]
    input1 = _T3_ARP
    input2 = 0
    ifequal = _RUNNING + _COMPOSEMODE
    else = _RUNNING
    output = _RUNNING_OR_COMPOSE_3

# Copy the gate to its final destination
[copy]
    input = _T3_MUTED_GATE * _RUNNING_OR_COMPOSE_3
    output = _T3_FINAL_GATE

# Copy the gate signal to the CV jack
[copy]
    input = _T3_FINAL_GATE
    output = G1.3

# -------------------------------------------------
# superjust (just intonation)
# -------------------------------------------------

# Bypassed by default: passes the final pitch/gate through unchanged onto internal
# signals (_T*_SUPERJUST_*). To enable, set bypass = 0 and route the outputs to the
# desired jacks. Kept out of the direct output path so the working wiring stays valid.
[superjust]
    bypass = 1
    input1 = _T1_FINAL_GATE
    input2 = 0
    input3 = _T2_FINAL_GATE
    input4 = 0
    input5 = _T2_FINAL_PITCH
    input6 = _T1_FINAL_PITCH
    input7 = _T3_FINAL_PITCH
    input8 = 0
    tuningmode = 0
    tuningpitch = 0
#   output1 = _T1_SUPERJUST_GATE
#   output2 = 0
#   output3 = _T2_SUPERJUST_GATE
#   output4 = 0
#   output5 = _T2_SUPERJUST_PITCH
#   output6 = _T1_SUPERJUST_PITCH
#   output7 = _T3_SUPERJUST_PITCH
#   output8 = 0

