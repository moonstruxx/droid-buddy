    input2 = _T1_BPACT_1
    output = _T1_CLEAR_PACT

# Minimum activity a step needs to have to be played
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T1_ARP_OFF
    selectat = 11
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    notches = 8
