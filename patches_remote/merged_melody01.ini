    selectat = 1
    input = _T1_ARP_AUTOSTOP * _ARP_AUTOSTOP_BLINK + _T1_ARP
    output = L3.9

# Autostop mode for ARP: When you hold CTRL while switching ARP on, it will automatically switch
# off the next time the sequence starts. This allows for easier jamming the ARP for doing fills.
[flipflop]
    set = B3.9 * _CONTROL
    reset = _T1_ARP_OFF
    output = _T1_ARP_AUTOSTOP

# Sync switching ARP on/off with clock in order to avoid audible glitches
[sample]
    input = _T1_ARP
    sample = _T1_CLOCK
    output = _T1_ARP_SYNCED

