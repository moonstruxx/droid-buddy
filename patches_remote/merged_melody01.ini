    selectat = 11
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    notches = 17
    startvalue = 0
    ledcolor = 0.6
    ledvalue = -0.3
    clear = _T1_CLEAR_PSS
    sharewithnext = 1
