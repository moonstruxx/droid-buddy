    startvalue = 1
    select = _CONTROL * _T3_SELECTED
    mode = 2
    ledfill = 0

[encoder]
    encoder = E4.3
    output = _T3_FILTER_VOLTAGE_MIN
    startvalue = -1
    select = _CONTROL * _T3_SELECTED
    mode = 2
    ledfill = 0

[encoder]
    encoder = E4.4
    output = _T3_FILTER_VOLTAGE_MAX
    startvalue = 1
    select = _CONTROL * _T3_SELECTED
    mode = 2
    ledfill = 0

# -------------------------------------------------
# Track 3: filter envelope (internal output)
# -------------------------------------------------

# Pot for attack length (left half of P5.1)
[pot]
    select = _T3_SELECTED * _ENV_FCV_BUTTON_HOLD
    pot = P5.1
    righthalf = _T3_FILTER_ENV_ATTACK_HALF
    loadpreset = _T3_LOAD_PRESET
    clear = _T3_CLEAR
    clearall = _FACTORY_RESET
    savepreset = _T3_SAVE_PRESET

[compare]
    input = _T3_FILTER_ENV_ATTACK_HALF
    compare = 0.5
    ifgreater = 0.5
    else = _T3_FILTER_ENV_ATTACK_HALF
    output = _T3_FILTER_ENV_ATTACK_POT

# Pot for decay length (right half of P5.1)
[pot]
    select = _T3_SELECTED * _ENV_FCV_BUTTON_HOLD
    pot = P5.1
    ledgauge = off
    outputscale = _DECAY_MAX
    loadpreset = _T3_LOAD_PRESET
    clear = _T3_CLEAR
    clearall = _FACTORY_RESET
    savepreset = _T3_SAVE_PRESET
    absbipolar = _T3_FILTER_ENV_DECAY_POT_ABSBIPOLAR

[copy]
    input = _T3_FILTER_ENV_DECAY_POT_ABSBIPOLAR * -1 + _DECAY_MIN
    output = _T3_FILTER_ENV_DECAY_POT

# Pot for CV attenuverter for level (P5.2)
[pot]
    select = _T3_SELECTED * _ENV_FCV_BUTTON_HOLD
    pot = P5.2
    outputscale = 2
    startvalue = 1
    loadpreset = _T3_LOAD_PRESET
    clear = _T3_CLEAR
    clearall = _FACTORY_RESET
    savepreset = _T3_SAVE_PRESET
    notch = 0.1
    bipolar = _T3_FILTER_ENV_ATTENUVERTER_POT

[copy]
    input = _T3_FILTER_CV * _T3_FILTER_ENV_ATTENUVERTER_POT
    output = _T3_FILTER_ENV_LEVEL

# AD envelope with CV control over level (internal output)
[contour]
    trigger = _T3_FINAL_GATE
    attack = _T3_FILTER_ENV_ATTACK_POT * _ATTACK_MAX
    release = _T3_FILTER_ENV_DECAY_POT
    level = _T3_FILTER_ENV_LEVEL
    attackshape = 0.5
    releaseshape = 0.5
#   output = _T3_FILTER_ENV_OUT

# -------------------------------------------------
# Track 3: velocity envelope (internal output)
# -------------------------------------------------

# Pot for attack length (left half of P5.1)
[pot]
    select = _T3_SELECTED * _ENV_VELO_BUTTON_HOLD
    pot = P5.1
    righthalf = _T3_VELO_ENV_ATTACK_HALF
    loadpreset = _T3_LOAD_PRESET
    clear = _T3_CLEAR
    clearall = _FACTORY_RESET
    savepreset = _T3_SAVE_PRESET

[compare]
    input = _T3_VELO_ENV_ATTACK_HALF
    compare = 0.5
    ifgreater = 0.5
    else = _T3_VELO_ENV_ATTACK_HALF
    output = _T3_VELO_ENV_ATTACK_POT

# Pot for decay length (right half of P5.1)
[pot]
    select = _T3_SELECTED * _ENV_VELO_BUTTON_HOLD
    pot = P5.1
    ledgauge = off
    outputscale = _DECAY_MAX
    loadpreset = _T3_LOAD_PRESET
    clear = _T3_CLEAR
    clearall = _FACTORY_RESET
    savepreset = _T3_SAVE_PRESET
    absbipolar = _T3_VELO_ENV_DECAY_POT_ABSBIPOLAR

[copy]
    input = _T3_VELO_ENV_DECAY_POT_ABSBIPOLAR * -1 + _DECAY_MIN
    output = _T3_VELO_ENV_DECAY_POT

# Pot for CV attenuverter for level (P5.2)
[pot]
    select = _T3_SELECTED * _ENV_VELO_BUTTON_HOLD
    pot = P5.2
    outputscale = 2
    startvalue = 1
    loadpreset = _T3_LOAD_PRESET
    clear = _T3_CLEAR
    clearall = _FACTORY_RESET
    savepreset = _T3_SAVE_PRESET
    notch = 0.1
    bipolar = _T3_VELO_ENV_ATTENUVERTER_POT

[copy]
    input = _T3_VELOCITY * _T3_VELO_ENV_ATTENUVERTER_POT
    output = _T3_VELO_ENV_LEVEL

# AD envelope with CV control over level (internal output)
[contour]
    trigger = _T3_FINAL_GATE
    attack = _T3_VELO_ENV_ATTACK_POT * _ATTACK_MAX
    release = _T3_VELO_ENV_DECAY_POT
    level = _T3_VELO_ENV_LEVEL
    attackshape = 0.5
    releaseshape = 0.5
#   output = _T3_VELO_ENV_OUT

# Silence the gate if the step does not reach the required activity
[compare]
    input = _T1_STEP_ACTIVITY
    compare = _T1_ACTIVITY
    ifless = 0
    else = _T1_SEQUENCER_GATE
    output = _T1_ACT_GATE

# Modulate gate length for gate output in arpeggiator mode
[gatetool]
    taptempo = _T1_ARP_TAPTEMPO
    gatelength = _T1_GATELENGTH
    inputgate = _T1_ARP_CLOCK
    outputgate = _T1_ARP_MODULATED_GATE

# Switch gate to arpeggiator if active
[ifequal]
    input1 = _T1_ARP_SYNCED
    input2 = 0
    ifequal = _T1_ACT_GATE
    else = _T1_ARP_MODULATED_GATE
    output = _T1_SWITCHED_GATE

# Logic for make the gate silent if the track is muted
[logic]
    input1 = -1 * _T1_MUTED + 1
    input2 = _T1_SWITCHED_GATE
    and = _T1_MUTED_GATE

# Select clock for arpeggiator of track 1. It is either the master clock or a multiplication
# of it, or the sequencer gate output.
[switch]
    input1 = _CLOCK
    input2 = _T1_SEQUENCER_GATE
    input3 = _CLOCK_3_2
    input4 = _CLOCK_2_1
    input5 = _CLOCK_3_1
    input6 = _CLOCK_4_1
    input7 = _CLOCK_6_1
    input8 = _CLOCK_8_1
    output1 = _T1_ARP_CLOCK
    offset = _T1_ARP_CLOCKING

# Create taptempo for arp clock to be used for gate length
[switch]
    input1 = _CLOCK
    input2 = _T1_CLOCK
    input3 = _CLOCK_3_2
    input4 = _CLOCK_2_1
    input5 = _CLOCK_3_1
    input6 = _CLOCK_4_1
    input7 = _CLOCK_6_1
    input8 = _CLOCK_8_1
    output1 = _T1_ARP_TAPTEMPO
    offset = _T1_ARP_CLOCKING * _T1_ARP

# Virtual pot for base pitch of arpeggiator
[pot]
    select = _T1_ARP * 100 + _SELECTED_TRACK
    selectat = 101
    pot = P5.2
    outputscale = 36
    output = _T1_ARP_PITCH

# Virtual pot for pitch range of arpeggiator
[pot]
    select = _T1_ARP * 100 + _SELECTED_TRACK
    selectat = 101
    pot = P5.1
    outputscale = 48
    output = _T1_ARP_RANGE

# Arpeggiator for track 1
[arpeggio]
    select1 = _T1_SEL_1
    select3 = _T1_SEL_2
    select5 = _T1_SEL_3
    select7 = _T1_SEL_4
    select9 = _T1_SEL_5
    select11 = _T1_SEL_6
    select13 = _T1_SEL_7
    selectfill1 = 0
    selectfill2 = 0
    selectfill3 = 0
    selectfill4 = 0
    selectfill5 = 0
    root = _ROOT * _T1_TBR_OFF
    transpose = _T1_TBR
    degree = _DEGREE
    clock = _T1_ARP_CLOCK * _RUNNING
    reset = _RESET
    tuningmode = _TUNINGMODE
    direction = _T1_ARP_UPDOWN
    pingpong = _T1_ARP_PINGPONG
    butterfly = _T1_ARP_BUTTERFLY
    octaves = _T1_ARP_OCTAVING
    drop = _T1_ARP_DROP
    pattern = _T1_ARP_PATTERN
    autoreset = _T1_ARP_AUTORESET
    pitch = _T1_ARP_PITCH / 120
    range = _T1_ARP_RANGE / 120
    output = _T1_ARP_OUTPUT

# Switch pitch output between sequencer and arpeggiator
[ifequal]
    input1 = _T1_ARP_SYNCED
    input2 = 0
    ifequal = _T1_PITCH
    else = _T1_ARP_OUTPUT + _T1_ARP_OCTAVE
    output = _T1_SWITCHED_PITCH

# Mix all sources of pitch together
[mixer]
    input1 = _T1_OCTAVE * 1V - 2V
    input2 = _T1_SWITCHED_PITCH
    input3 = _GLOBAL_OCTAVE_SWITCH * 1V - 2V
    input4 = _GLOBAL_TRANSPOSITION * 0.00833333
    output = _T1_FINAL_PITCH

# Slew limiter for glides
[slew]
    input = _T1_FINAL_PITCH
    exponential = O1
    slew = _T1_GLIDE * _T1_GLIDE_LENGTH

# If we are in compose mode and the arpeggiator is switched off, the gate is output even if
# the sequencer is stopped.
[ifequal]
    input1 = _T1_ARP
    input2 = 0
    ifequal = _RUNNING + _COMPOSEMODE
    else = _RUNNING
    output = _RUNNING_OR_COMPOSE_1

# Copy the gate to its final destination
[copy]
    input = _T1_MUTED_GATE * _RUNNING_OR_COMPOSE_1
    output = _T1_FINAL_GATE

# Copy the gate signal to the CV jack
[copy]
    input = _T1_FINAL_GATE
    output = G1.1

# -------------------------------------------------
# Track 2
# -------------------------------------------------

# Provide trigger when the clear button is pressed (no Ctrl needed)
[button]
    select = _SELECTED_TRACK
    selectat = 2
    button = B3.5
    shortpress = _T2_CLEAR_BUTTON
    states = 1

# Clear button with control together clears the track
[copy]
    input = _T2_CLEAR_BUTTON * _CONTROL
    output = _T2_CLEAR

# Clear button without control removes all mode that alter the pattern length
[logic]
    input1 = _T2_CLEAR_BUTTON
    input2 = -1 * _CONTROL + 1
    and = _T2_PEACE

# Five blinks for the clear LED
[burst]
    trigger = _T2_CLEAR + _FACTORY_RESET
    hz = 5
    count = 5
    output = _T2_CLEAR_LED

# LED only blinks when track is selected
[select]
    select = _SELECTED_TRACK
    selectat = 2
    input = _T2_CLEAR_LED + 0.3
    output = L3.5

# Reset track immediately
[button]
    select = _SELECTED_TRACK
    selectat = 2
    button = B3.11 * _NO_CONTROL
    states = 1
    output = _T2_RESET

# Button for copy and paste
[button]
    select = _SELECTED_TRACK
    selectat = 2
    button = B3.24
    states = 1
    output = _T2_COPY_BUTTON

# This button cycles between the song froms A, AAAB and AABB
[button]
    select = _SELECTED_TRACK
    selectat = 2
    clear = _T2_CLEAR
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    button = B3.7
    led = L3.7
    output = _T2_FORM
    states = 3

# Disables scale and note selection if on
[button]
    select = _SELECTED_TRACK
    selectat = 2
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    button = B3.8
    led = L3.8
    output = _T2_12TONE

# Enable transposing the melody by the difference of the root note to C
[button]
    select = _SELECTED_TRACK
    selectat = 2
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    button = B3.12
    led = L3.12
    output = _T2_TBR_ON
    inverted = _T2_TBR_OFF

# Provide the amount of 'transpose by root' in a patch cable
[ifequal]
    input1 = _T2_TBR_ON
    input2 = 1
    ifequal = _ROOT / 120
    output = _T2_TBR

# Hold to contiously step faders to random positions, hold with Ctrl to change buttons
[button]
    select = _SELECTED_TRACK
    selectat = 2
    button = B3.10
    states = 1
    onvalue = _LUCKY_CLOCK
    output = _T2_LUCKY

# Selects melodic inversion (swap low and high notes)
[button]
    select = _SELECTED_TRACK
    selectat = 2
    clear = _T2_CLEAR
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    button = B3.6
    led = L3.6
    output = _T2_INVERT

# Combine all triggers for clearing
[mixer]
    input1 = _T2_CLEAR + _T2_PEACE
    input2 = _T2_BPAR_1 + _T2_BPAR_2
    output = _T2_CLEAR_PAR

# Reset track after X clock ticks
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T2_ARP_OFF
    selectat = 12
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    notches = 17
    startvalue = 0
    ledcolor = 0.8
    ledvalue = -0.3
    clear = _T2_CLEAR_PAR
    sharewithnext = 1
    fader = 1
    button = _T2_BPAR_1

# Reset track after X clock ticks
[motorfader]
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    notches = 17
    startvalue = 0
    ledcolor = 0.8
    ledvalue = -0.3
    clear = _T2_CLEAR_PAR
    select = _GLOBAL_FADER_SELECTION
    selectat = 98
    fader = 5
    button = _T2_BPAR_2
    output = _T2_AUTORESET

# Combine all triggers for clearing
[mixer]
    input1 = _T2_CLEAR + _T2_PEACE
    input2 = _T2_BPSS_1 + _T2_BPSS_2
    output = _T2_CLEAR_PSS

# Shift the steps of the sequence by this number
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T2_ARP_OFF
    selectat = 12
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    notches = 17
    startvalue = 0
    ledcolor = 0.6
    ledvalue = -0.3
    clear = _T2_CLEAR_PSS
    sharewithnext = 1
    fader = 2
    button = _T2_BPSS_1

# Shift the steps of the sequence by this number
[motorfader]
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    notches = 17
    startvalue = 0
    ledcolor = 0.6
    ledvalue = -0.3
    clear = _T2_CLEAR_PSS
    select = _GLOBAL_FADER_SELECTION
    selectat = 98
    fader = 6
    button = _T2_BPSS_2
    output = _T2_SHIFTSTEPS

# Combine all triggers for clearing
[mixer]
    input1 = _T2_CLEAR
    input2 = _T2_BPOCT_1 + _T2_BPOCT_2
    output = _T2_CLEAR_POCT

# Octave switch: -2, -1, 0, +1, +2
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T2_ARP_OFF
    selectat = 12
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    notches = 5
    startvalue = 2
    ledcolor = 0.2
    ledvalue = -0.3
    clear = _T2_CLEAR_POCT
    sharewithnext = 1
    fader = 3
    button = _T2_BPOCT_1

# Octave switch: -2, -1, 0, +1, +2
[motorfader]
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    notches = 5
    startvalue = 2
    ledcolor = 0.2
    ledvalue = -0.3
    clear = _T2_CLEAR_POCT
    select = _GLOBAL_FADER_SELECTION
    selectat = 98
    fader = 7
    button = _T2_BPOCT_2
    output = _T2_OCTAVE

# Combine all triggers for clearing
[mixer]
    input1 = _T2_CLEAR
    input2 = _T2_BPDT_1 + _T2_BPDT_2
    output = _T2_CLEAR_PDT

# Diatonic transposition
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T2_ARP_OFF
    selectat = 12
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    notches = 15
    startvalue = 7
    ledcolor = 0.4
    ledvalue = -0.3
    outputoffset = -7
    clear = _T2_CLEAR_PDT
    sharewithnext = 1
    fader = 4
    button = _T2_BPDT_1

# Diatonic transposition
[motorfader]
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    notches = 15
    startvalue = 7
    ledcolor = 0.4
    ledvalue = -0.3
    outputoffset = -7
    clear = _T2_CLEAR_PDT
    select = _GLOBAL_FADER_SELECTION
    selectat = 98
    fader = 8
    button = _T2_BPDT_2
    output = _T2_NOTESHIFT

# Prevent diatonic transposition from happending between clock ticks
[sample]
    input = _T2_NOTESHIFT
    sample = _CLOCK
    output = _T2_NOTESHIFT_CLOCKED

# Combine all triggers for clearing
[mixer]
    input1 = _T2_CLEAR
    input2 = _T2_BPACT_1
    output = _T2_CLEAR_PACT

# Minimum activity a step needs to have to be played
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T2_ARP_OFF
    selectat = 12
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    notches = 8
    startvalue = 0
    ledcolor = 0.55
    ledvalue = -0.3
    clear = _T2_CLEAR_PACT
    output = _T2_ACTIVITY
    fader = 5
    button = _T2_BPACT_1

# Combine all triggers for clearing
[mixer]
    input1 = _T2_CLEAR + _T2_PEACE
    input2 = _T2_BPPAT_1
    output = _T2_CLEAR_PPAT

# Movement pattern: normal, reverse, ping pong, >><, 2><, etc.
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T2_ARP_OFF
    selectat = 12
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    notches = 10
    startvalue = 0
    ledcolor = 0.3
    ledvalue = -0.3
    clear = _T2_CLEAR_PPAT
    output = _T2_PATTERN_FADER
    fader = 6
    button = _T2_BPPAT_1

# Set the direction to reverse on fader position 1
[ifequal]
    input1 = _T2_PATTERN_FADER
    input2 = 1
    ifequal = 1
    output = _T2_DIRECTION

# Enable ping pong on fader position 2
[ifequal]
    input1 = _T2_PATTERN_FADER
    input2 = 2
    ifequal = 1
    output = _T2_PINGPONG

# Combine all triggers for clearing
[mixer]
    input1 = _T2_CLEAR
    input2 = _T2_BPCDEVEN_1
    output = _T2_CLEAR_PCDEVEN

# Clock division for even divides/multipliers
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T2_ARP_OFF
    selectat = 12
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    notches = 7
    startvalue = 3
    ledcolor = 1.1
    ledvalue = -0.3
    clear = _T2_CLEAR_PCDEVEN
    output = _T2_CD_EVEN
    fader = 7
