    luckycvs = _LUCKY_CVS_S3 * _T3_SELECTED
    luckygates = _LUCKY_GATES_S3 * _T3_SELECTED
    luckyrandomizecv = _LUCKY_RAND_S3 * _T3_SELECTED
    luckyratchets = _LUCKY_RATC_S3 * _T3_SELECTED
    luckyrepeats = _LUCKY_REPEAT_S3 * _T3_SELECTED
    luckyspread = _LUCKY_SPREAD_S3 * _T3_SELECTED
    luckyties = _LUCKY_TIES_S3 * _T3_SELECTED
    defaultgate = 0
#   luckyamount = _LUCKY_AMNT
#   luckychance = _LUCKY_CHANCE
#   luckycvbase = _LUCKY_CVBASE
    quantize = 0
    buttoncolor = 0.5
