    luckycvdrift = _LUCKY_DRIFT_S2 * _T3_SELECTED
    luckycvs = _LUCKY_CVS_S2 * _T3_SELECTED
    luckygates = _LUCKY_GATES_S2 * _T3_SELECTED
    luckyrandomizecv = _LUCKY_RAND_S2 * _T3_SELECTED
    luckyratchets = _LUCKY_RATC_S2 * _T3_SELECTED
    luckyrepeats = _LUCKY_REPEAT_S2 * _T3_SELECTED
