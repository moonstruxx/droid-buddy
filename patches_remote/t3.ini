    luckycvs = _LUCKY_CVS_S1 * _T3_SELECTED
    luckyfaders = _T3_LUCKY * _NO_CONTROL
    luckygates = _LUCKY_GATES_S1 * _T3_SELECTED
    luckyrandomizecv = _LUCKY_RAND_S1 * _T3_SELECTED
    luckyratchets = _LUCKY_RATC_S1 * _T3_SELECTED
    luckyrepeats = _LUCKY_REPEAT_S1 * _T3_SELECTED
    luckyscope = _LUCKY_SCOPE
    luckyspread = _LUCKY_SPREAD_S1 * _T3_SELECTED
    luckyties = _LUCKY_TIES_S1 * _T3_SELECTED
    mute = -1 * _RUNNING + 1
    numfaders = 8
    numsteps = 32
    page = _T3_PAGE_SEL_FIN
    pattern = -1 * 2 + _T3_PATTERN_FADER
    pingpong = _T3_PINGPONG
    ratchetshift = _T3_RATCHETSHIFT
    repeatshift = _T3_REPEATSHIFT
    reset = _RESET + _T3_RESET
    root = _ROOT * _T3_TBR_OFF
    savepreset = _T3_SAVE_PRESET
    select = _GLOBAL_FADER_SELECTION
