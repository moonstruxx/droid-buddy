    longpress = _T3_P4_SAVE

# Five blinks for the LED of the preset button on saving
[burst]
    trigger = _T3_P4_SAVE
    hz = 5
    count = 5
    output = _T3_P4_SAVE_LED

# Write the save LED animation to the LED if the track is still selected.
[select]
    select = _SELECTED_TRACK
    selectat = 3
    input = _T3_P4_SAVE_LED + 0.3
    output = L3.4

# Create a trigger with the preset as value when any of the presets is loaded
[mixer]
    input1 = _T3_P1_LOAD
    input2 = _T3_P2_LOAD
    input3 = _T3_P3_LOAD
    input4 = _T3_P4_LOAD
    output = _T3_LOAD_PRESET

# Create a trigger with the preset as value when any of the presets is saved
[mixer]
    input1 = _T3_P1_SAVE * 1
    input2 = _T3_P2_SAVE * 2
    input3 = _T3_P3_SAVE * 3
    input4 = _T3_P4_SAVE * 4
    output = _T3_SAVE_PRESET

# Select which notes from the current scale should be played
[buttongroup]
    select = _SELECTED_TRACK * _NO_LUCKY
    selectat = 3
    minactive = 1
    maxactive = _CONTROL * -6 + 7
    startbutton = -1
    button1 = B5.1
    led1 = L5.1
    buttonoutput1 = _T3_SEL_1
    button2 = B5.2
    led2 = L5.2
    buttonoutput2 = _T3_SEL_2
    button3 = B5.3
    led3 = L5.3
    buttonoutput3 = _T3_SEL_3
    button4 = B5.4
    led4 = L5.4
    buttonoutput4 = _T3_SEL_4
    button5 = B5.5
    led5 = L5.5
    buttonoutput5 = _T3_SEL_5
    button6 = B5.6
    led6 = L5.6
    buttonoutput6 = _T3_SEL_6
    button7 = B5.7
    led7 = L5.7
    buttonoutput7 = _T3_SEL_7

# Clock divider for track 3
[clocktool]
    clock = _CLOCK
    reset = _RESET
    divide = _T3_CD_EVEN_DIV * _T3_CD_ODD_DIV
    multiply = _T3_CD_EVEN_MULT * _T3_CD_ODD_MULT
    output = _T3_CLOCK

[timing]
    clock = _T3_CLOCK
    reset = _RESET
    timing1 = 0
    timing2 = _T3_CLOCK
    output = _T3_CLOCK_SWINGED

# Mix global and per-track diatonic transposition
[mixer]
    input1 = _T3_NOTESHIFT_CLOCKED
    input2 = _GLOBAL_NOTESHIFT_CLOCKED
    output = _T3_NOTESHIFT_SUM

# The clear range logic should just affect the current track
[ifequal]
    input1 = _SELECTED_TRACK * _RANGE
    input2 = 3
    ifequal = 1
    output = _T3_CLEAR_RANGE

# Collect different sources of resetting the start/end point
[logic]
    input1 = _T3_CLEAR + _T3_PEACE
    input2 = _T3_CLEAR_RANGE * _CONTROL
    or = _T3_CLEARSTARTEND

# Note shift for each step repetition
[pot]
    select = _T3_ARP * 100 + _SELECTED_TRACK
    selectat = 3
    pot = P5.1
    discrete = 15
    startvalue = 7
    outputoffset = -7
    output = _T3_REPEATSHIFT

# Note shift for each ratchet
[pot]
    select = _T3_ARP * 100 + _SELECTED_TRACK
    selectat = 3
    pot = P5.2
    discrete = 15
    startvalue = 7
    outputoffset = -7
    output = _T3_RATCHETSHIFT

[select]
    input = B3.10
    output = _T3_LUCKY
    select = _T3_SELECTED

# Sequencer for pitch and gate of track 3
[motoquencer]
    accumulatorrange = _T3_ACCU_RANGE
    autoreset = _T3_AUTORESET
    bulkedit = _CONTROL
    buttonmode = _BUTTONMODE
