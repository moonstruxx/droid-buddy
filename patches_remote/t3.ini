    selectat = 3
    button = B3.4 * _CONTROL
    states = 1
    onvalue = 4
    output = _T3_P4_LOAD

# Button for saving preset 4 on track 3
[button]
    select = _SELECTED_TRACK
    selectat = 3
    button = B3.4
    states = 1
