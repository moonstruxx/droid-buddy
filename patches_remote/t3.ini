# Track 3

# -------------------------------------------------
# Track 3
# -------------------------------------------------

# Provide trigger when the clear button is pressed (no Ctrl needed)
[button]
    select = _SELECTED_TRACK * _NO_LUCKY
    selectat = 3
    button = B3.5
    shortpress = _T3_CLEAR_BUTTON
    states = 1
 

# Clear button with control together clears the track
[copy]
    input = _T3_CLEAR_BUTTON * _CONTROL
    output = _T3_CLEAR

# Clear button without control removes all mode that alter the pattern length
[logic]
    input1 = _T3_CLEAR_BUTTON
    input2 = -1 * _CONTROL + 1
    and = _T3_PEACE

# Five blinks for the clear LED
[burst]
    trigger = _T3_CLEAR + _FACTORY_RESET
    hz = 5
    count = 5
    output = _T3_CLEAR_LED

# LED only blinks when track is selected
[select]
    select = _SELECTED_TRACK
    selectat = 3
    input = _T3_CLEAR_LED + 0.3
    output = L3.5

[logic]
    input1 = _NO_CONTROL
    input2 = _NO_LUCKY
    and = _NO_LUCKY_CONTROL

# Reset track immediately
[button]
    select = _SELECTED_TRACK * _NO_LUCKY_CONTROL
    selectat = 3
    button = B3.6
    states = 1
    output = _T3_RESET
    led = L3.6

# Button for copy and paste
[button]
    select = _SELECTED_TRACK
    selectat = 3
    button = B3.24
    states = 1
    output = _T3_COPY_BUTTON

# This button cycles between the song froms A, AAAB and AABB
[button]
    select = _SELECTED_TRACK
    selectat = 3
    clear = _T3_CLEAR
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    button = B3.11
    led = L3.11
    output = _T3_FORM
    states = 3

# Disables scale and note selection if on
[button]
    select = _SELECTED_TRACK
    selectat = 3
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    button = B3.12
    led = L3.12
    output = _T3_12TONE

# Enable transposing the melody by the difference of the root note to C
[button]
    select = _SELECTED_TRACK
    selectat = 3
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    output = _T3_TBR_ON
    inverted = _T3_TBR_OFF

# Provide the amount of 'transpose by root' in a patch cable
[ifequal]
    input1 = _T3_TBR_ON
    input2 = 1
    ifequal = _ROOT / 120
    output = _T3_TBR

# Combine all triggers for clearing
[mixer]
    input1 = _T3_CLEAR + _T3_PEACE
    input2 = _T3_BPAR_1 + _T3_BPAR_2
    output = _T3_CLEAR_PAR

# Reset track after X clock ticks
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T3_ARP_OFF
    selectat = 13
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    notches = 17
    startvalue = 0
    ledcolor = 0.8
    ledvalue = -0.3
    clear = _T3_CLEAR_PAR
    sharewithnext = 1
    fader = 1
    button = _T3_BPAR_1

# Reset track after X clock ticks
[motorfader]
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    notches = 17
    startvalue = 0
    ledcolor = 0.8
    ledvalue = -0.3
    clear = _T3_CLEAR_PAR
    select = _GLOBAL_FADER_SELECTION
    selectat = 98
    fader = 5
    button = _T3_BPAR_2
    output = _T3_AUTORESET

# Combine all triggers for clearing
[mixer]
    input1 = _T3_CLEAR + _T3_PEACE
    input2 = _T3_BPSS_1
    output = _T3_CLEAR_PSS

# Shift the steps of the sequence by this number
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T3_ARP_OFF
    selectat = 13
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    notches = 17
    startvalue = 0
    ledcolor = 0.6
    ledvalue = -0.3
    clear = _T3_CLEAR_PSS
    output = _T3_SHIFTSTEPS
    fader = 2
    button = _T3_BPSS_1

# Combine all triggers for clearing
[mixer]
    input1 = _T3_CLEAR
    input2 = _T3_BPOCT_1
    output = _T3_CLEAR_POCT

# Octave switch: -2, -1, 0, +1, +2
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T3_ARP_OFF
    selectat = 13
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    notches = 5
    startvalue = 2
    ledcolor = 0.2
    ledvalue = -0.3
    clear = _T3_CLEAR_POCT
    output = _T3_OCTAVE
    fader = 3
    button = _T3_BPOCT_1

# Combine all triggers for clearing
[mixer]
    input1 = _T3_CLEAR
    input2 = _T3_BPDT_1
    output = _T3_CLEAR_PDT

# Diatonic transposition
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T3_ARP_OFF
    selectat = 13
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    notches = 15
    startvalue = 7
    ledcolor = 0.4
    ledvalue = -0.3
    outputoffset = -7
    clear = _T3_CLEAR_PDT
    output = _T3_NOTESHIFT
    fader = 4
    button = _T3_BPDT_1

# Prevent diatonic transposition from happending between clock ticks
[sample]
    input = _T3_NOTESHIFT
    sample = _CLOCK
    output = _T3_NOTESHIFT_CLOCKED

# Combine all triggers for clearing
[mixer]
    input1 = _T3_CLEAR
    input2 = _T3_BPACT_1
    output = _T3_CLEAR_PACT

# Minimum activity a step needs to have to be played
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T3_ARP_OFF
    selectat = 13
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    notches = 8
    startvalue = 0
    ledcolor = 0.55
    ledvalue = -0.3
    clear = _T3_CLEAR_PACT
    output = _T3_ACTIVITY
    fader = 5
    button = _T3_BPACT_1

# Combine all triggers for clearing
[mixer]
    input1 = _T3_CLEAR + _T3_PEACE
    input2 = _T3_BPPAT_1 + _T3_BPPAT_2
    output = _T3_CLEAR_PPAT

# Movement pattern: normal, reverse, ping pong, >><, 2><, etc.
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T3_ARP_OFF
    selectat = 13
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    notches = 10
    startvalue = 0
    ledcolor = 0.3
    ledvalue = -0.3
    clear = _T3_CLEAR_PPAT
    sharewithnext = 1
    fader = 6
    button = _T3_BPPAT_1

# Movement pattern: normal, reverse, ping pong, >><, 2><, etc.
[motorfader]
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    notches = 10
    startvalue = 0
    ledcolor = 0.3
    ledvalue = -0.3
    clear = _T3_CLEAR_PPAT
    select = _GLOBAL_FADER_SELECTION
    selectat = 98
    fader = 6
    button = _T3_BPPAT_2
    output = _T3_PATTERN_FADER

# Set the direction to reverse on fader position 1
[ifequal]
    input1 = _T3_PATTERN_FADER
    input2 = 1
    ifequal = 1
    output = _T3_DIRECTION

# Enable ping pong on fader position 2
[ifequal]
    input1 = _T3_PATTERN_FADER
    input2 = 2
    ifequal = 1
    output = _T3_PINGPONG

# Combine all triggers for clearing
[mixer]
    input1 = _T3_CLEAR
    input2 = _T3_BPCDEVEN_1
    output = _T3_CLEAR_PCDEVEN

# Clock division for even divides/multipliers
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T3_ARP_OFF
    selectat = 13
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    notches = 7
    startvalue = 3
    ledcolor = 1.1
    ledvalue = -0.3
    clear = _T3_CLEAR_PCDEVEN
    output = _T3_CD_EVEN
    fader = 7
    button = _T3_BPCDEVEN_1

# Select the multiplier based on the fader position
[switch]
    input1 = 1
    input2 = 1
    input3 = 1
    input4 = 1
    input5 = 2
    input6 = 4
    input7 = 8
    offset = _T3_CD_EVEN
    output1 = _T3_CD_EVEN_MULT

# Select the division based on the fader position
[switch]
    input1 = 8
    input2 = 4
    input3 = 2
    input4 = 1
    input5 = 1
    input6 = 1
    input7 = 1
    offset = _T3_CD_EVEN
    output1 = _T3_CD_EVEN_DIV

# Combine all triggers for clearing
[mixer]
    input1 = _T3_CLEAR
    input2 = _T3_BPCDODD_1
    output = _T3_CLEAR_PCDODD

# Clock division for odd divides/multipliers
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T3_ARP_OFF
    selectat = 13
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    notches = 7
    startvalue = 3
    ledcolor = 1.2
    ledvalue = -0.3
    clear = _T3_CLEAR_PCDODD
    output = _T3_CD_ODD
    fader = 8
    button = _T3_BPCDODD_1

# Select the multiplier based on the fader position
[switch]
    input1 = 1
    input2 = 1
    input3 = 1
    input4 = 1
    input5 = 3
    input6 = 5
    input7 = 7
    offset = _T3_CD_ODD
    output1 = _T3_CD_ODD_MULT

# Select the division based on the fader position
[switch]
    input1 = 7
    input2 = 5
    input3 = 3
    input4 = 1
    input5 = 1
    input6 = 1
    input7 = 1
    offset = _T3_CD_ODD
    output1 = _T3_CD_ODD_DIV

# Switch on/off arpeggio mode for track 3
[button]
    select = _SELECTED_TRACK
    selectat = 3
    button = B3.9
    clear = _T3_START_OF_SEQUENCE * _T3_ARP_AUTOSTOP
    output = _T3_ARP
    negated = _T3_ARP_OFF

# The LED of the ARP button blinks when it is on but in Autostop mode
[select]
    select = _SELECTED_TRACK
    selectat = 3
    input = _T3_ARP_AUTOSTOP * _ARP_AUTOSTOP_BLINK + _T3_ARP
    output = L3.9

# Autostop mode for ARP: When you hold CTRL while switching ARP on, it will automatically switch
# off the next time the sequence starts. This allows for easier jamming the ARP for doing fills.
[flipflop]
    set = B3.9 * _CONTROL
    reset = _T3_ARP_OFF
    output = _T3_ARP_AUTOSTOP

# Sync switching ARP on/off with clock in order to avoid audible glitches
[sample]
    input = _T3_ARP
    sample = _T3_CLOCK
    output = _T3_ARP_SYNCED

# Auto reset arpeggiator after N number of steps
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T3_ARP
    selectat = 13
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    fader = 1
    notches = 17
    ledcolor = 0.8
    ledvalue = 1
    output = _T3_ARP_AUTORESET
    header = "AUTORESET"

# Enable ping pong mode
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T3_ARP
    selectat = 13
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    fader = 2
    notches = 3
    ledcolor = 0.85
    ledvalue = 1
    output = _T3_ARP_DIRECTION

# Provide gate for reversed direction of arpeggio
[ifequal]
    input1 = _T3_ARP_DIRECTION
    input2 = 2
    ifequal = 1
    else = 0
    output = _T3_ARP_UPDOWN

# Provide gate for ping pong of arpeggio
[ifequal]
    input1 = _T3_ARP_DIRECTION
    input2 = 1
    ifequal = 1
    else = 0
    output = _T3_ARP_PINGPONG

# Seperate octave switch for the arpeggio
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T3_ARP
    selectat = 13
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    fader = 3
    notches = 5
    ledcolor = 0.2
    startvalue = 2
    ledvalue = 1
    output = _T3_ARP_OCTAVE_SWITCH

# Enable butterfly mode
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T3_ARP
    selectat = 13
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    fader = 4
    notches = 2
    ledcolor = 1.15
    ledvalue = 1
    output = _T3_ARP_BUTTERFLY

# Select one of three octaving patterns
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T3_ARP
    selectat = 13
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    fader = 5
    notches = 3
    ledcolor = 0.4
    ledvalue = 1
    output = _T3_ARP_OCTAVING

# Compute octave offset pitches from fader setting
[copy]
    input = _T3_ARP_OCTAVE_SWITCH * 1V - 2V
    output = _T3_ARP_OCTAVE

# Select the arpeggio pattern
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T3_ARP
    selectat = 13
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    fader = 6
    notches = 7
    ledcolor = 0.3
    ledvalue = 1
    output = _T3_ARP_PATTERN

# Select one of four different drop patterns
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T3_ARP
    selectat = 13
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    fader = 7
    notches = 4
    ledcolor = 0.5
    ledvalue = 1
    output = _T3_ARP_DROP

# Select one of several clocking patterns
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T3_ARP
    selectat = 13
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    fader = 8
    notches = 8
    ledcolor = 1.1
    ledvalue = 1
    output = _T3_ARP_CLOCKING

# Button for loading preset 1 on track 3
[button]
    select = _SELECTED_TRACK
    selectat = 3
    button = B3.1 * _CONTROL
    states = 1
    onvalue = 1
    output = _T3_P1_LOAD

# Button for saving preset 1 on track 3
[button]
