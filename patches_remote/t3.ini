    luckyspread = _LUCKY_SPREAD_S2 * _T3_SELECTED
    luckyties = _LUCKY_TIES_S2 * _T3_SELECTED
    page = _T3_PAGE_SEL_FIN
    quantize = 0
    savepreset = _T3_SAVE_PRESET
