# Sequencer for gate length and glide
[motoquencer]
    select = _GLOBAL_FADER_SELECTION
    selectat = 3
    page = _T3_PAGE_SEL_FIN
    stepcopy = _T3_COPY_BUTTON
    doublerange = _T3_COPY_BUTTON
    clear = _T3_CLEAR
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
