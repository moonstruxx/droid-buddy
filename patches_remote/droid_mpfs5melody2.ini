    attack = _T2_FILTER_ENV_ATTACK_POT * _ATTACK_MAX
    release = _T2_FILTER_ENV_DECAY_POT
    level = _T2_FILTER_ENV_LEVEL
    attackshape = _T2_FILTER_ENV_LIN_EXP * 0.25 + 0.5
    releaseshape = _T2_FILTER_ENV_LIN_EXP * 0.5 + 0.5
    output = O6

