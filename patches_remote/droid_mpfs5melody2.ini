# Melody sequencer with 3 tracks
# LABELS: master=18
# INPUTS:
#  I1: [CLK] Global transposition of all tracks
#  I2: [RST] Scale
#  I3: [Scale] Scale, in 1/12V steps.
#  I4: Set the running state of the sequencer
#  I5: [KB V]
#  I6: [KB V]
#  I7: [KB G]

# OUTPUTS:
#  O1: [T3 Vel]
#  O2: [t1 velo env] Pitch CV output track 1
#  O3: [t1 filt en] Modulation CV output track 1
#  O4: [t2 P] Modulation CV output track 2
#  O5: [t2 velo] Pitch CV output track 2
#  O6: [t2 fcv]
#  O7: [T3 P]
#  O8: [t3 Fcv]

# GATES ON X7:
#  G9: [T8_acc]
#  G11: [t9_acc]

# GATES ON MODULE 1:
#  G1.1: [T1 Gate]
#  G1.2: [T1 ACC]
#  G1.5: [clk in] Gate output track 1
#  G1.6: [CLK/O] Clock output while running
#  G1.7: [GateB 2] Additional gate for track 2
#  G1.8: [RST/O] Reset output

# GATES ON MODULE 2:
#  G2.1: [T2 Gate]
#  G2.3: [T2 ACC]
#  G2.5: [T3 Gate]
#  G2.7: [Tg3 acc]

# CONTROLLER 3:
#  B3.1: [Preset A] Ctrl: Switch to preset A, long press: save to preset A
#  B3.2: [Preset B] Ctrl: Switch to preset B, long press: save to preset B
#  B3.3: [Preset C] Ctrl: Switch to preset C, long press: save to preset C
#  B3.4: [Preset D] Ctrl: Switch to preset D, long press: save to preset D
#  B3.5: [CLR/ S/E]
#  B3.6: [reset/LS All]
#  B3.7: [LS: S/E CP]
#  B3.8: [LS: CP]
#  B3.9: [ARP] Switch this track to arpeggio mode
#  B3.10: [LUCKY]
#  B3.11: [AAAB] Switch between the song from A, AAAB and AABB
#  B3.12: [CHRO] Disable scale and note selection, allow all 12 notes
#  B3.13: [TON] Tonality menu
#  B3.14: [swing] Menu for clock speed and swing
#  B3.15: [TRK] Track menu
#  B3.16: [PERF] Performance menu
#  B3.17: [RATC] Number of sub gates per clock
#  B3.18: [REP] Number of repeats, skip steps
#  B3.19: [PAT] Pattern for repeated gates
#  B3.20: [S/E] Set start and end (range of steps to play)
#  B3.21: [RAND] Pitch randomization
#  B3.22: [ACT] Set step activities
#  B3.23: [PROB] Gate probability
#  B3.24: [COPY] Copy current page of current track. With CTRL: Paste
#  B3.25: [NOTE] Set motor faders to pitch
#  B3.26: [GL] Gate length and glide
#  B3.27: [VELO] Velocity / Additional gate
#  B3.28: [FCV] If enabled, transposes the melody when the root note changes.
#  B3.29: [Track 1] Select track 1
#  B3.30: [Track 2] Select track 2
#  B3.31: [Track 3] Select track 3
#  B3.32: [MIDI SEQ] Start/stop sequencer - start also does reset

# CONTROLLER 5:
#  P5.1: [RANGE/REPEAT] Arpeggio pitch range / Repeat note shift
#  P5.2: [BASE/RATCH] Arpeggio base pitch / Ratchet note shift
#  B5.1: [ROOT/CVS] Allow root note
#  B5.2: [3RD/SPREAD] Allow third note
#  B5.3: [5TH/DRIFT] Allow fifth note
#  B5.4: [7TH/RAND] Allow seventh note
#  B5.5: [9TH/RATC] Allow nineth note
#  B5.6: [11TH/REP] Allow eleventh note
#  B5.7: [13TH/GATES] Allow thirtheenth note
#  B5.8: [Lucky] Switch some of the button functions

# CONTROLLER 6:
#  S6.9: [GLBL Mute]
#  S6.10: [DispMaster]

[m4]
[m4]
[b32]
[e4]
[p2b8]
[s10]

