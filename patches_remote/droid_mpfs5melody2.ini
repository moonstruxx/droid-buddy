# -------------------------------------------------
# Track 1
# -------------------------------------------------

# Provide trigger when the clear button is pressed (no Ctrl needed)
[button]
    select = _SELECTED_TRACK
    selectat = 1
    button = B3.5
    shortpress = _T1_CLEAR_BUTTON
    states = 1

[select]
    input = B3.10
    output = _T1_LUCKY
    select = _T1_SELECTED

# Clear button with control together clears the track
[copy]
    input = _T1_CLEAR_BUTTON * _CONTROL
    output = _T1_CLEAR

# Clear button without control removes all mode that alter the pattern length
[logic]
    input1 = _T1_CLEAR_BUTTON
    input2 = -1 * _CONTROL + 1
    and = _T1_PEACE

# Five blinks for the clear LED
[burst]
    trigger = _T1_CLEAR + _FACTORY_RESET
    hz = 5
    count = 5
    output = _T1_CLEAR_LED

# LED only blinks when track is selected
[select]
    select = _SELECTED_TRACK
    selectat = 1
    input = _T1_CLEAR_LED + 0.3
    output = L3.5

# Reset track immediately
[button]
    select = _SELECTED_TRACK * _NO_LUCKY_CONTROL
    selectat = 1
    button = B3.6
    states = 1
    output = _T1_RESET
    led = L3.6

# Button for copy and paste
[button]
    select = _SELECTED_TRACK
    selectat = 1
    button = B3.24
    states = 1
    output = _T1_COPY_BUTTON

# This button cycles between the song froms A, AAAB and AABB
[button]
    select = _SELECTED_TRACK
    selectat = 1
    clear = _T1_CLEAR
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    button = B3.11
    led = L3.11
    output = _T1_FORM
    states = 3

# Disables scale and note selection if on
[button]
    select = _SELECTED_TRACK
    selectat = 1
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    button = B3.12
    led = L3.12
    output = _T1_12TONE

# Enable transposing the melody by the difference of the root note to C
[button]
    select = _SELECTED_TRACK
    selectat = 1
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    output = _T1_TBR_ON
    inverted = _T1_TBR_OFF

# Provide the amount of 'transpose by root' in a patch cable
[ifequal]
    input1 = _T1_TBR_ON
    input2 = 1
    ifequal = _ROOT / 120
    output = _T1_TBR

# Combine all triggers for clearing
[mixer]
    input1 = _T1_CLEAR + _T1_PEACE
    input2 = _T1_BPAR_1 + _T1_BPAR_2
    output = _T1_CLEAR_PAR

# Reset track after X clock ticks
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T1_ARP_OFF
    selectat = 11
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    notches = 17
    startvalue = 0
    ledcolor = 0.8
    ledvalue = -0.3
    clear = _T1_CLEAR_PAR
    sharewithnext = 1
    fader = 1
    button = _T1_BPAR_1

# Reset track after X clock ticks
[motorfader]
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    notches = 17
    startvalue = 0
    ledcolor = 0.8
    ledvalue = -0.3
    clear = _T1_CLEAR_PAR
    select = _GLOBAL_FADER_SELECTION
    selectat = 98
    fader = 1
    button = _T1_BPAR_2
    output = _T1_AUTORESET

# Combine all triggers for clearing
[mixer]
    input1 = _T1_CLEAR + _T1_PEACE
    input2 = _T1_BPSS_1
    output = _T1_CLEAR_PSS

# Shift the steps of the sequence by this number
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T1_ARP_OFF
    selectat = 11
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    notches = 17
    startvalue = 0
    ledcolor = 0.6
    ledvalue = -0.3
    clear = _T1_CLEAR_PSS
    output = _T1_SHIFTSTEPS
    fader = 2
    button = _T1_BPSS_1

# Combine all triggers for clearing
[mixer]
    input1 = _T1_CLEAR
    input2 = _T1_BPOCT_1
    output = _T1_CLEAR_POCT

# Octave switch: -2, -1, 0, +1, +2
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T1_ARP_OFF
    selectat = 11
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    notches = 5
    startvalue = 2
    ledcolor = 0.2
    ledvalue = -0.3
    clear = _T1_CLEAR_POCT
    output = _T1_OCTAVE
    fader = 3
    button = _T1_BPOCT_1

# Combine all triggers for clearing
[mixer]
    input1 = _T1_CLEAR
    input2 = _T1_BPDT_1
    output = _T1_CLEAR_PDT

# Diatonic transposition
[motorfader]
