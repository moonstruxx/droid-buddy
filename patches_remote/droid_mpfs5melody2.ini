    startbutton = -1
    button1 = B5.1
    led1 = L5.1
    buttonoutput1 = _T1_SEL_1
    button2 = B5.2
    led2 = L5.2
    buttonoutput2 = _T1_SEL_2
    button3 = B5.3
    led3 = L5.3
    buttonoutput3 = _T1_SEL_3
    button4 = B5.4
    led4 = L5.4
