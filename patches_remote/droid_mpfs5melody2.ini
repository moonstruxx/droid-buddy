    select = _T2_SELECTED * _ENV_FCV_BUTTON_HOLD
    pot = P5.2
    outputscale = 2
    loadpreset = _T2_LOAD_PRESET
    clear = _T2_CLEAR
    clearall = _FACTORY_RESET
    savepreset = _T2_SAVE_PRESET
    startvalue = 1
    notch = 0.1
    output = _T2_FILTER_ENV_ATTENUVERTER_POT

[copy]
