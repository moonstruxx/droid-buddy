    button = B4.1
    longpress = _T2_FILTER_ENV_SWITCH

[burst]
    trigger = _T2_FILTER_ENV_SWITCH
    hz = 5
    count = 5
    output = L4.1

[flipflop]
    toggle = _T2_FILTER_ENV_SWITCH
    output = _T2_FILTER_ENV_LIN_EXP

# Pot for attack lenght
[pot]
    select = _T2_SELECTED * _ENV_FCV_BUTTON_HOLD
    pot = P5.1
    loadpreset = _T2_LOAD_PRESET
    clear = _T2_CLEAR
    clearall = _FACTORY_RESET
    savepreset = _T2_SAVE_PRESET
    righthalf = _T2_FILTER_ENV_ATTACK_HALF

[compare]
    input = _T2_FILTER_ENV_ATTACK_HALF
    compare = 0.5
    ifgreater = 0.5
    else = _T2_FILTER_ENV_ATTACK_HALF
    output = _T2_FILTER_ENV_ATTACK_POT

# Pot for decay lenght
[pot]
    select = _T2_SELECTED * _ENV_FCV_BUTTON_HOLD
    pot = P5.1
    loadpreset = _T2_LOAD_PRESET
    clear = _T2_CLEAR
    clearall = _FACTORY_RESET
    savepreset = _T2_SAVE_PRESET
    ledgauge = off
    outputscale = _DECAY_MAX
    absbipolar = _T2_FILTER_ENV_DECAY_POT_ABSBIPOLAR

[copy]
