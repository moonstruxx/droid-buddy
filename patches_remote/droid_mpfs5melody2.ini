    loadpreset = _T2_LOAD_PRESET
#   luckyamount = _LUCKY_AMNT2
#   luckycvbase = _LUCKY_CVBASE2
    luckycvdrift = _LUCKY_DRIFT_S2 * _T2_SELECTED
    luckycvs = _LUCKY_CVS_S2 * _T2_SELECTED
    luckygates = _LUCKY_GATES_S2 * _T2_SELECTED
    luckyrandomizecv = _LUCKY_RAND_S2 * _T2_SELECTED
    luckyratchets = _LUCKY_RATC_S2 * _T2_SELECTED
    luckyrepeats = _LUCKY_REPEAT_S2 * _T2_SELECTED
    luckyspread = _LUCKY_SPREAD_S2 * _T2_SELECTED
    luckyties = _LUCKY_TIES_S2 * _T2_SELECTED
    savepreset = _T2_SAVE_PRESET
    gate = _T2_ACC_GATE
    buttoncolor = 0.9
    gatelength = 0.99
    cv = _T2_VELOCITY
    defaultcv = _T2_VELO_VOLTAGE_MAX * 0.5
    cvbase = _T2_VELO_VOLTAGE_MIN
    cvrange = _T2_VELO_VOLTAGE_MAX
    quantize = 0
    cvname = "Velocity"
    bulkedit = _CONTROL
    linktonext = 1

# Sequencer for gate length and glide
[motoquencer]
    select = _GLOBAL_FADER_SELECTION
    selectat = 2
    page = _T2_PAGE_SEL_FIN
    stepcopy = _T2_COPY_BUTTON
    doublerange = _T2_COPY_BUTTON
    clear = _T2_CLEAR
    luckycvdrift = _LUCKY_DRIFT_S3 * _T2_SELECTED
    luckycvs = _LUCKY_CVS_S3 * _T2_SELECTED
    luckygates = _LUCKY_GATES_S3 * _T2_SELECTED
    luckyrandomizecv = _LUCKY_RAND_S3 * _T2_SELECTED
    luckyratchets = _LUCKY_RATC_S3 * _T2_SELECTED
    luckyrepeats = _LUCKY_REPEAT_S3 * _T2_SELECTED
    luckyspread = _LUCKY_SPREAD_S3 * _T2_SELECTED
    luckyties = _LUCKY_TIES_S3 * _T2_SELECTED
    loadpreset = _T2_LOAD_PRESET + B3.5
    savepreset = _T2_SAVE_PRESET
    cv = _T2_GATELENGTH
    defaultcv = 7V
    defaultgate = 0
    quantize = 0
    buttoncolor = 0.5
    cvname = "Gate length"
    bulkedit = _CONTROL
    linktonext = 1
    gate = _T2_GLIDE
    gatename = "Glide"

# Sequencer for activity level per step
[motoquencer]
    select = _GLOBAL_FADER_SELECTION
    selectat = 2
    clear = _T2_CLEAR
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    cv = _T2_STEP_ACTIVITY
    quantize = 0
    defaultcv = 7
    cvname = "Activity"
    cvnotches = 8
    bulkedit = _CONTROL
    linktonext = 1

# filter cv1
[motoquencer]
    bulkedit = _CONTROL
    clear = _T2_CLEAR
    cvbase = _T2_FILTER_VOLTAGE_MIN
    cvname = "Activity"
    cvrange = _T2_FILTER_VOLTAGE_MAX
    defaultcv = _T2_FILTER_VOLTAGE_MAX * 0.5
    linktonext = 1
    loadpreset = _T2_LOAD_PRESET
    luckycvdrift = _LUCKY_DRIFT_S4 * _T2_SELECTED
    luckycvs = _LUCKY_CVS_S4 * _T2_SELECTED
    luckygates = _LUCKY_GATES_S4 * _T2_SELECTED
    luckyrandomizecv = _LUCKY_RAND_S4 * _T2_SELECTED
    luckyratchets = _LUCKY_RATC_S4 * _T2_SELECTED
    luckyrepeats = _LUCKY_REPEAT_S4 * _T2_SELECTED
    luckyspread = _LUCKY_SPREAD_S4 * _T2_SELECTED
    luckyties = _LUCKY_TIES_S4 * _T2_SELECTED
    page = _T2_PAGE_SEL_FIN
    quantize = 0
    savepreset = _T2_SAVE_PRESET
    select = _GLOBAL_FADER_SELECTION
    selectat = 2
    cv = _T2_FILTER_CV

# Silence the gate if the step does not reach the required activity
[compare]
    input = _T2_STEP_ACTIVITY
    compare = _T2_ACTIVITY
    ifless = 0
    else = _T2_SEQUENCER_GATE
    output = _T2_ACT_GATE

# Modulate gate length for gate output in arpeggiator mode
[gatetool]
    taptempo = _T2_ARP_TAPTEMPO
    gatelength = _T2_GATELENGTH
    inputgate = _T2_ARP_CLOCK
    outputgate = _T2_ARP_MODULATED_GATE

# Switch gate to arpeggiator if active
[ifequal]
    input1 = _T2_ARP_SYNCED
    input2 = 0
    ifequal = _T2_ACT_GATE
    else = _T2_ARP_MODULATED_GATE
    output = _T2_SWITCHED_GATE

# Logic for make the gate silent if the track is muted
[logic]
    input1 = -1 * _T2_MUTED + 1
    input2 = _T2_SWITCHED_GATE
    and = _T2_MUTED_GATE

# Select clock for arpeggiator of track 2. It is either the master clock or a multiplication
# of it, or the sequencer gate output.
[switch]
    input1 = _CLOCK
    input2 = _T2_SEQUENCER_GATE
    input3 = _CLOCK_3_2
    input4 = _CLOCK_2_1
    input5 = _CLOCK_3_1
    input6 = _CLOCK_4_1
    input7 = _CLOCK_6_1
    input8 = _CLOCK_8_1
    output1 = _T2_ARP_CLOCK
    offset = _T2_ARP_CLOCKING

# Create taptempo for arp clock to be used for gate length
[switch]
    input1 = _CLOCK
    input2 = _T2_CLOCK
    input3 = _CLOCK_3_2
    input4 = _CLOCK_2_1
    input5 = _CLOCK_3_1
    input6 = _CLOCK_4_1
    input7 = _CLOCK_6_1
    input8 = _CLOCK_8_1
    output1 = _T2_ARP_TAPTEMPO
    offset = _T2_ARP_CLOCKING * _T2_ARP

# Virtual pot for base pitch of arpeggiator
[pot]
    select = _T2_ARP * 100 + _SELECTED_TRACK
    selectat = 102
    pot = P5.2
    outputscale = 36
    output = _T2_ARP_PITCH

# Virtual pot for pitch range of arpeggiator
[pot]
    select = _T2_ARP * 100 + _SELECTED_TRACK
    selectat = 102
    pot = P5.1
    outputscale = 48
    output = _T2_ARP_RANGE

# Arpeggiator for track 2
[arpeggio]
    select1 = _T2_SEL_1
    select3 = _T2_SEL_2
    select5 = _T2_SEL_3
    select7 = _T2_SEL_4
    select9 = _T2_SEL_5
    select11 = _T2_SEL_6
    select13 = _T2_SEL_7
    selectfill1 = 0
    selectfill2 = 0
    selectfill3 = 0
    selectfill4 = 0
    selectfill5 = 0
    root = _ROOT * _T2_TBR_OFF
    transpose = _T2_TBR
    degree = _DEGREE
    clock = _T2_ARP_CLOCK * _RUNNING
    reset = _RESET
    tuningmode = _TUNINGMODE
    direction = _T2_ARP_UPDOWN
    pingpong = _T2_ARP_PINGPONG
    butterfly = _T2_ARP_BUTTERFLY
    octaves = _T2_ARP_OCTAVING
    drop = _T2_ARP_DROP
    pattern = _T2_ARP_PATTERN
    autoreset = _T2_ARP_AUTORESET
    pitch = _T2_ARP_PITCH / 120
    range = _T2_ARP_RANGE / 120
    output = _T2_ARP_OUTPUT

# Switch pitch output between sequencer and arpeggiator
[ifequal]
    input1 = _T2_ARP_SYNCED
    input2 = 0
    ifequal = _T2_PITCH
    else = _T2_ARP_OUTPUT + _T2_ARP_OCTAVE
    output = _T2_SWITCHED_PITCH

# Mix all sources of pitch together
[mixer]
    input1 = _T2_OCTAVE * 1V - 2V
    input2 = _T2_SWITCHED_PITCH
    input3 = _GLOBAL_OCTAVE_SWITCH * 1V - 2V
    input4 = _GLOBAL_TRANSPOSITION * 0.00833333
    output = _T2_FINAL_PITCH

# Slew limiter for glides
[slew]
    input = _T2_FINAL_PITCH
    exponential = _T2_FINAL_PITCH_OUT
    slew = _T2_GLIDE * _T2_GLIDE_LENGTH

# If we are in compose mode and the arpeggiator is switched off, the gate is output even if
# the sequencer is stopped.
[ifequal]
    input1 = _T2_ARP
    input2 = 0
    ifequal = _RUNNING + _COMPOSEMODE
    else = _RUNNING
    output = _RUNNING_OR_COMPOSE_2

