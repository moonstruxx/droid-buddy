    ledvalue = -0.3
    clear = _T1_CLEAR_PACT
    output = _T1_ACTIVITY
    fader = 5
    button = _T1_BPACT_1

# Combine all triggers for clearing
[mixer]
    input1 = _T1_CLEAR + _T1_PEACE
    input2 = _T1_BPPAT_1 + _T1_BPPAT_2
    output = _T1_CLEAR_PPAT

# Movement pattern: normal, reverse, ping pong, >><, 2><, etc.
