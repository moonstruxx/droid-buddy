    luckyrandomizecv = _LUCKY_RAND_S1 * _T1_SELECTED
    luckyratchets = _LUCKY_RATC_S1 * _T1_SELECTED
    luckyrepeats = _LUCKY_REPEAT_S1 * _T1_SELECTED
