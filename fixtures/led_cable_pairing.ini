# led_cable_pairing.ini — LED association only accepts a bare LED token.
#
# A `led`/`ledN` parameter is an OUTPUT: its value is what the circuit writes to
# the register (schema `button.led`: "Usually you wire that output to a LED
# register, e.g. to L1.1"). Only a bare LED token therefore names a register and
# can bind an element to an LED. A cable reference (`led = _CABLE`) or an
# expression names a *value*, binds nothing, and leaves the positional/device
# default in force — otherwise the button face loses its LED fill and the real
# LED register renders as a standalone cell beside the button (the "some
# buttons still show LED control" defect on P2B8/B32 patches such as
# droid_mpfs5drum.ini and droid_mpfs5melody3.ini).
#
# The fixture must load with no Error-severity validation finding.

[p2b8]

[b32]

# (a) Bare `led` entry holding a cable: B1.1 keeps its positional LED L1.1.
[button]
    button = B1.1
    onvalue = 1
    offvalue = 0
    states = 1
    led = _CABLE_LED_STATE
    output = _CABLE_BUTTON

# (b) Numbered `ledN` entry holding a cable, paired by suffix with `button1`:
# B2.1 keeps its positional LED L2.1.
[buttongroup]
    button1 = B2.1
    value1 = 1
    led1 = _CABLE_GROUP_LED
    output = _GROUP_SELECT

# (c) Control: a bare LED token still binds, so B1.2's face shows L1.4.
[button]
    button = B1.2
    led = L1.4
    output = _EXPLICIT_BUTTON

# (d) Control on the B32: a bare LED token binds its own register.
[button]
    button = B2.2
    led = L2.2
    output = _PLAIN_BUTTON

[copy]
    input = _CABLE_BUTTON
    output = O1
