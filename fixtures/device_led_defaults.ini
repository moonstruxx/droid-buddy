# device_led_defaults — per-controller device-default LED wiring (task 3.2).
# Bare sections synthesize full front panels (design.md Decision 2b):
#   [m4]  -> M4 Motorfader panel 1: P1.1..P1.4 (motor faders), B1.1..B1.4
#           (touch buttons), L1.1..L1.4. The B touch plates default-link to
#           their RGB LED twin L{inst}.{n} (`device_default_led`, task 3.1).
#   [b32] -> B32 Notebuttons panel 2: B2.1..B2.32 + L2.1..L2.32. White-only,
#           so buttons get no default LED (stay `led: None`).
#   [copy] -> master CV I/O jacks I1/O1 (controller "CV I/O"): I1 default-links
#           to R1, O1 to R9 (the master 4x4 CD-channel registers).
# The tests assert the data-model association produced by
# `device_default_led` for each controller; the explicit-pairing-wins rule
# is pinned separately in the parser-level regression test.

[m4]

[b32]

[copy]
    input = I1
    output = O1