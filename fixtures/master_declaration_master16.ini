# LABELS: master=16
# A declared MASTER patch that treats every input jack as CV. MASTER hosts
# I1..I8 as CV inputs, so the declaration matches every use and no master
# finding is reported.
[p2b8]
[copy]
    input = I1
    output = O1
[copy]
    input = I2
    output = O2
[copy]
    input = I3
    output = O3
[copy]
    input = I4
    output = O4
[copy]
    input = I5
    output = O5
[copy]
    input = I6
    output = O6
[copy]
    input = I7
    output = O7
[copy]
    input = I8
    output = O8
