[p2b8]
# Documented alternatives satisfy an essential 2 input (patch-validation).
# One section per ALTERNATIVE_INPUTS row, then one control per row that sets
# none of that row's alternatives. Every section is otherwise complete, so the
# only possible missing_required finding is the one under test.

# lfo.hz <- taptempo
[lfo]
taptempo = G1

# gatetool.inputgate <- inputtrigger
[gatetool]
inputtrigger = G1

# contour.gate <- trigger
[contour]
trigger = G1

# compare.ifequal <- ifless (input and compare stay required and are set)
[compare]
input = 0
compare = 0
ifless = I1

# controls: same circuits, none of their alternatives
[lfo]
level = 1
[gatetool]
gatelength = 1
[contour]
attack = 1
[compare]
input = 0
compare = 0
