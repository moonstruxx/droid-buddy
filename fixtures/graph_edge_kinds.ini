# fixtures/graph_edge_kinds.ini — edge color-by-kind coverage (task 5.3).
# A single banner cluster chaining four circuits so each reachable inferred
# cable kind renders in the view at once:
#   _CLK  produced by clocktool     -> Control (cyan)
#   _AUD  produced by osc           -> Audio   (green)
#   _NOTE produced by notesequencer -> Midi    (magenta)
[clocktool]
    output = _CLK

[osc]
    input = _CLK
    output = _AUD

[notesequencer]
    input = _AUD
    output = _NOTE

[vca]
    input = _NOTE

# Controller section so the parser has hardware components (real patches
# always declare one); it carries no cables so it adds only a node.
[p2b8]
