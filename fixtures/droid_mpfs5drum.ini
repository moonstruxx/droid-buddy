    output = _CLOCK_8_1
    multiply = 8
    divide = 1

# -------------------------------------------------
# stable clock
# -------------------------------------------------

[sequencer]
    repeat1 = 2
    repeat2 = 2
    repeat3 = 2
    repeat8 = 1
    repeat7 = 3
    repeat4 = 2
    repeat6 = 2
    repeat5 = 2
    clock = _CLOCK
    steps = 16
    gate8 = 1
    chaintonext = 1
    gateoutput = _CLOCK_SAMPLE_TRIG_SEQ
    gate1 = 0
    gate2 = 0
    gate3 = 0
    gate4 = 0
    gate5 = 0
    gate6 = 0
    gate7 = 0

[logic]
    input1 = _CLOCK_SAMPLE_TRIG_SEQ
    input2 = _RESET
    or = _CLOCK_SAMPLE_TRIG

[switch]
    input1 = _CLOCK_SAMPLE_TRIG
    input2 = 0
    offset =
    output1 = _CLOCK_SAMPLE_TRIG_LOCKED
    input3 = 0

[sample]
    input = _CLOCK_PITCH
    sample = _CLOCK_SAMPLE_TRIG_LOCKED
    output = _CLOCK_PITCH_SAMPLE

[pot]
    pot = P1.1
    outputscale = 1
    notch = 0
    output = _CLOCK_SLEW

[slew]
    input = _CLOCK_PITCH_SAMPLE
    linear = _CLOCK_PITCH_SAMPLE_SLEW
    slewup = 128 * _CLOCK_SLEW
    slewdown = 128 * _CLOCK_SLEW

[lfo]
    level = 1
    bipolar = 0
    square = _STABLE_CLOCK_GATE
    rate = _CLOCK_PITCH_SAMPLE_SLEW
    sync = _RESET

