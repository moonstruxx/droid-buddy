# Melody sequencer with 3 tracks
# LABELS: master=18
# INPUTS:
#  I1: [Transp] Global transposition of all tracks
#  I2: [Root] Root note, in 1/12V steps.
#  I3: [Scale] Scale, in 1/12V steps.
#  I4: Set the running state of the sequencer
#  I5: [KB V]
#  I6: [KB V]
#  I7: [KB G]

# OUTPUTS:
#  O1: [T3 P]
#  O2: [T3 Vel]
#  O3: [t3 Fcv]
#  O4: [t5 Pitch] Pitch CV output track 1
#  O5: [V/O 2] Pitch CV output track 2
#  O6: [Velo 2] Modulation CV output track 2
#  O7: [t2 fcv]
#  O8: [t6 V] Modulation CV output track 1

# GATES ON X7:
#  G9: [T8_acc]
#  G11: [t9_acc]

# GATES ON MODULE 1:
#  G1.1: [t7]
#  G1.2: [acc]
#  G1.3: [run in] Additional gate for track 1
#  G1.4: [run]
#  G1.5: [clk in] Gate output track 1
#  G1.6: [CLK/O] Clock output while running
#  G1.8: [RST/O] Reset output

# GATES ON MODULE 2:
#  G2.1: [t5]
#  G2.2: [acc]
#  G2.3: [t6]
#  G2.4: [acc]
#  G2.5: [G3]
#  G2.6: [Gate 2] Gate output track 2
#  G2.8: [GateB 2] Additional gate for track 2

# CONTROLLER 1:
#  P1.1: [clk slew]
#  P1.2: [clk swing]
#  B1.1: [p1 / Roll S]
#  B1.2: [p2 / Fill S]
#  B1.3: [p3 /  luck]
#  B1.4: [P4 /Droid]
#  B1.5: [Global]
#  B1.6: [Mute 5]
#  B1.7: [CTRL]
#  B1.8: [Track 5]

# CONTROLLER 2:
#  B2.1: [Step 1]
#  B2.2: [Step 2]
#  B2.3: [Step 3]
#  B2.4: [Step 4]
#  B2.5: [Step 5]
#  B2.6: [Step 6]
#  B2.7: [Step 7]
#  B2.8: [Step 8]
#  B2.9: [Step 9]
#  B2.10: [Step 10]
#  B2.11: [Step 11]
#  B2.12: [Step 12]
#  B2.13: [Step 13]
#  B2.14: [Step 14]
#  B2.15: [Step 15]
#  B2.16: [Step 16]
#  B2.17: [Preset A]
#  B2.18: [Preset B]
#  B2.19: [Preset C]
#  B2.20: [Preset D]
#  B2.21: [Alternate]
#  B2.22: [Accent]
#  B2.23: [2nd  lvl]
#  B2.24: [Length]
#  B2.25: [Mute 6]
#  B2.26: [Mute 7]
#  B2.27: [Mute 8]
#  B2.28: [Mute 9]
#  B2.29: [Track 6]
#  B2.30: [Track 7]
#  B2.31: [Track 8]
#  B2.32: [track 9]

# CONTROLLER 3:
#  E3.1: [Activity]
#  E3.2: [Fill]
#  E3.3: [Roll]
#  E3.4: [Variation]

[p2b8]
[b32]
[e4]

