# Split clock bending fader in two hemispheres, so the the lower one is linear and can go to
# 0 Hz, while the upper half is going to exactly double speed.
# [pot]
#   pot = _CLOCK_BEND
#   lefthalfinv = _CLOCK_BEND_LINEAR
#   righthalf = _CLOCK_BEND_EXP

# [math]
#   input1 = 2
#   input2 = _CLOCK_BEND_EXP
#   power = _CLOCK_BEND_FACTOR

# [copy]
#   input = _CLOCK_BPM_THREE_FADERS * _CLOCK_BEND_LINEAR
#   output = _CLOCK_BPM_LINEAR

# [copy]
#   input = _CLOCK_BPM_LINEAR * _CLOCK_BEND_FACTOR
#   output = _CLOCK_BPM_UNMUTED

# Set the BPM to zero while the clock is muted.
# [copy]
#   input = _CLOCK_BPM_UNMUTED * _INT_CLOCK_UNMUTED
#   output = _CLOCK_BPM

# The actual clock, use a very short pulse so we have essentially just triggers
# [lfo]
#   hz = _CLOCK_BPM / 15
#   pulsewidth = 0.1
#   square = _INT_CLOCK
#   sync = _RUNNING

# Detect an external clock signal, if within the last 2 seconds there was a trigger
# [gatetool]
#   inputtrigger = I5
#   gatelength = 2
#   outputgate = _EXTERNAL_CLOCK_PRESENT

# Select first avaiable clock in defined precedence order
# [case]
#   case1 = _INT_CLOCK_UNMUTED
#   value1 = _INT_CLOCK
#   case2 = _EXTERNAL_CLOCK_PRESENT
#   value2 = I5
#   output = _CLOCK_UNSWUNG

[copy]
    input = _RUNNING
    output = G1.4

[copy]
    input = G1.5
    output = _CLOCK_IN

[clocktool]
    clock = _CLOCK_IN
    divide = 1
    multiply = 1
    delay = 0
    output = _CLOCK_UNSWUNG
    inputpitch = _CLOCK_PITCH

# Apply swing to the clock
[timing]
    clock = _CLOCK_UNSWUNG
    reset = _RESET
    timing1 = 0
    timing2 = P1.2 * 0.33
    output = _CLOCK

# Clock division 3/2 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_3_2
    multiply = 3
    divide = 2

# Clock division 2/1 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_2_1
    multiply = 2
    divide = 1

# Clock division 3/1 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_3_1
    multiply = 3
    divide = 1

# Clock division 4/1 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_4_1
    multiply = 4
    divide = 1

# Clock division 6/1 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_6_1
    multiply = 6
    divide = 1

# Clock division 8/1 for the arpeggiators
[clocktool]
