# faceplate_rotary_stack.ini — one patch declaring all six controllers the
# controller-geometry-fidelity change corrects (P2B8, P4B2, P10, S10, E4,
# DB8E) so the screenshot harness can render their faceplates in one frame
# (task 3.2). The cross-layer story that loads this file asserts presence and
# token attribution only — never positions or pitches (those belong to
# src/physical.rs, task 1.1) — so it stays green across the geometry
# regeneration in task 2.1.
#
# Instance numbering: a bare [p2b8]/[p10]/[s10]/[e4] takes its controller
# number from the chain position of bare controller sections only, which is
# 1..4 in this file's order. p4b2 and db8e are NOT bare-synthesized (their
# fronts are spec-dependent and are not in BARE_SYNTHESIS), so they declare
# their tokens explicitly and use the free positions 5 (p4b2) and 6 (db8e).
# That keeps every token id distinct: in particular the E4's synthesized
# E4.1 and the DB8E's explicit E6.1 are separate encoder tokens resolving on
# separate faceplates instead of one being deduplicated away.

[p2b8]

[p4b2]
    pot1 = P5.1
    pot2 = P5.2
    pot3 = P5.3
    pot4 = P5.4
    button1 = B5.1
    led1 = L5.1
    button2 = B5.2
    led2 = L5.2

[p10]

[s10]

[e4]

[db8e]
    button1 = B6.1
    button2 = B6.2
    button3 = B6.3
    button4 = B6.4
    button5 = B6.5
    button6 = B6.6
    button7 = B6.7
    button8 = B6.8
    encoder = E6.1
