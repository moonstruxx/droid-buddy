# graph_select_state — select-state graph regression fixture (change C 5.1)
#
# Two circuits select on S7.1 with different selectat values. Assuming each
# S7.1 value drops the losing circuit's controller edge (button = B*) while
# keeping its cable and jack edges (the S7.1 select reference resolves to an
# InputJack because no controller ordinal 7 exists). One button circuit
# carries no select and stays Selected under any assumption; an output jack
# stays wired regardless of assumed state.
#
#  0  p2b8           (bare controller -> Controller node, ordinal 1)
#  1  p2b8           (bare controller -> Controller node, ordinal 2)
#  2  sel_a          (select S7.1 selectat 0, button = B1.1, output = _SELA)
#  3  sel_b          (select S7.1 selectat 1, button = B2.1, output = _SELB)
#  4  button         (button = B3.1, input = _SELA + _SELB, no select)
#  5  outputjack     (output = O1)
[p2b8]

[p2b8]

[sel_a]
    select = S7.1
    selectat = 0
    button = B1.1
    output = _SELA

[sel_b]
    select = S7.1
    selectat = 1
    button = B2.1
    output = _SELB

[button]
    button = B3.1
    input = _SELA
    input = _SELB

[outputjack]
    output = O1