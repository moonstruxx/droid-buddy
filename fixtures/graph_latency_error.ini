# fixtures/graph_latency_error.ini — topology error coexisting with latency
# (task 2.2, error precedence). Two findings ride on real cables so the red
# `graph_edge_error` highlight coexists with latency-colored edges:
#   _BUS driven by two sources (clocktool + copy) -> n -> 1 Error edge (red)
#   _ORPHAN referenced as a sink but never produced -> dangling Warning
# The healthy _CLK / _MIX forward cables color by kind (ramp once task 2.1).
[clocktool]
    output = _CLK
    output = _BUS

[copy]
    input = _CLK
    output = _BUS

[mixer]
    input = _BUS
    output = _MIX

[contour]
    gate = _MIX
    input = _ORPHAN

# Controller section so the parser has hardware components (real patches
# always declare one); it carries no cables so it adds only a node.
[p2b8]
