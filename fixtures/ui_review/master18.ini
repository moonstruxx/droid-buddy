# fixtures/ui_review/master18.ini — MASTER18 physical-front fixture (6 HP).
# The master faceplate resolves to master18 whenever the patch addresses a
# CV jack above 8 (Patch::master_requirement). Here I9..I12 force it; the
# copy outputs O1..O6 land on the cv_out jack cells O1..O6, and the extra
# inputs fall on the gin/gout jack cells positionally.

[copy]
    input = I9
    output = O1
[copy]
    input = I10
    output = O2
[copy]
    input = I11
    output = O3
[copy]
    input = I12
    output = O4
[copy]
    input = I13
    output = O5
[copy]
    input = I14
    output = O6