# fixtures/ui_review/g8.ini — G8 physical-front fixture (4 HP).
# G8 = 8 gate jacks (geometry cells G1.1..G1.8) + 8 LEDs (geometry cells
# R17..R24). Gate jacks are not patch-addressable tokens in this model
# (HW_TOKEN_LETTERS has no 'G'), and there is no "[g8]" section name in the
# DROID schema (circuits.json), so the fixture can only carry the LED row as
# L-family tokens via [button] led params. Those map positionally to the
# g8 L-family cells once a [g8] section name exists; today they render as a
# fallback "Controller 1" panel.

[button]
    led = L1.1
[button]
    led = L1.2
[button]
    led = L1.3
[button]
    led = L1.4
[button]
    led = L1.5
[button]
    led = L1.6
[button]
    led = L1.7
[button]
    led = L1.8