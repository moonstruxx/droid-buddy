# fixtures/ui_review/p8s8.ini — P8S8 physical-front fixture (8 HP).
# A fader bank: 8 sliders (F grid; controller_geometry.json labels the
# cells P1.1..P1.8 — DROID addresses the sliders via P registers), 8 LEDs
# (L1.1..L1.8), 8 switches (S1.1..S1.8). [faderbank] IS a
# KNOWN_CONTROLLER_SECTIONS name -> controller "Faderbank" -> resolves to
# the p8s8 geometry key today, so this fixture already renders the real
# faceplate (the L/S rows draw; the F row needs an M/F-family token, see
# physical::family_for — P tokens stay components without a cell).
# `select = B1.1` carries the hardware token that registers controller
# number 1; `firstfader`/`ledcolor` are plain numbers (no token).

[faderbank]
    firstfader = 1
    notches = 0
    select = B1.1
    selectat = 99
    ledcolor = 1.2
    ledvalue1 = 1

[copy]
    input = P1.1
    output = _FADER1
[copy]
    input = P1.2
    output = _FADER2
[copy]
    input = P1.3
    output = _FADER3
[copy]
    input = P1.4
    output = _FADER4
[copy]
    input = P1.5
    output = _FADER5
[copy]
    input = P1.6
    output = _FADER6
[copy]
    input = P1.7
    output = _FADER7
[copy]
    input = P1.8
    output = _FADER8

[button]
    led = L1.1
[button]
    led = L1.2
[button]
    led = L1.3
[button]
    led = L1.4
[button]
    led = L1.5
[button]
    led = L1.6
[button]
    led = L1.7
[button]
    led = L1.8

[switch]
    switch = S1.1
[switch]
    switch = S1.2
[switch]
    switch = S1.3
[switch]
    switch = S1.4
[switch]
    switch = S1.5
[switch]
    switch = S1.6
[switch]
    switch = S1.7
[switch]
    switch = S1.8