# fixtures/ui_review/p4b2.ini — P4B2 physical-front fixture (5 HP).
# One P4B2 instance: four pots (P1.1..P1.4), two buttons (B1.1..B1.2) with
# LEDs (L1.1..L1.2). The [p4b2] controller section declares the module and
# carries its token entries; the [button]/[copy] circuits touch the same
# tokens so the parser scans them (dedupe keeps one component per token).
# NOTE: [p4b2] is schema-known but not yet in patch.rs
# KNOWN_CONTROLLER_SECTIONS, so these tokens currently group as a fallback
# "Controller 1" panel; registering the section name resolves the same file
# to the p4b2 geometry key (5 HP, P grid + B/L cells).

[p4b2]
    pot1 = P1.1
    pot2 = P1.2
    pot3 = P1.3
    pot4 = P1.4
    button1 = B1.1
    button2 = B1.2
    led1 = L1.1
    led2 = L1.2

[button]
    button = B1.1
    led = L1.1
    output = _GATE1

[button]
    button = B1.2
    led = L1.2

[copy]
    input = P1.1
    output = _POT1