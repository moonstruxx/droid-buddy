# fixtures/ui_review/x7.ini — X7 physical-front fixture (4 HP).
# X7 = 4 gate outputs (geometry cells G9..G12), 8 LEDs (geometry cells
# R49..R56), 1 USB switch. Gate tokens are not scanned by patch.rs and the
# USB cell has no hardware-token family, so the fixture carries the LED row
# (L tokens, positional) and the switch (S1.1). `switch = S1.1` on [switch]
# is tolerated as unknown_param (non-gating) exactly like the existing
# switch fixtures (switch_value.ini, render_outlier_matrix.ini). Today all
# tokens render as a fallback "Controller 1" panel.

[switch]
    switch = S1.1

[button]
    led = L1.1
[button]
    led = L1.2
[button]
    led = L1.3
[button]
    led = L1.4
[button]
    led = L1.5
[button]
    led = L1.6
[button]
    led = L1.7
[button]
    led = L1.8