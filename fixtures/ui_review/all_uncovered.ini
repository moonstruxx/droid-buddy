# fixtures/ui_review/all_uncovered.ini — gallery row: one instance of each
# controller whose physical front is not yet snapshot-covered (p4b2, p8s8,
# db8e, g8, x7, master18) in a single patch.
# Resolution today: [faderbank] claims controller number 1 -> "Faderbank" ->
# p8s8 faceplate (L/S tokens draw on it); the CV jacks I9+ force the
# master18 faceplate; the remaining tokens (P/B/E/S/L from the other
# sections) are all number-1 and therefore land on the same p8s8 module as
# invisible or drawn components. Once patch.rs KNOWN_CONTROLLER_SECTIONS
# grows the section names, each controller separates onto its own faceplate.

[p4b2]
    pot1 = P1.1
    pot2 = P1.2
    button1 = B1.1
    led1 = L1.1

[faderbank]
    firstfader = 1
    notches = 0
    select = B1.1
    selectat = 99
    ledcolor = 1.2
    ledvalue1 = 1

[db8e]
    button1 = B1.1
    button2 = B1.2
    encoder = E1.1
    led1 = L1.1

# g8/x7 have no schema section names: LED row + USB switch tokens only
[button]
    led = L1.2
[button]
    led = L1.3
[button]
    led = L1.4
[switch]
    switch = S1.1

# CV jacks 9+ force the master18 faceplate
[copy]
    input = I9
    output = O1