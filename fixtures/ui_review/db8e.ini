# fixtures/ui_review/db8e.ini — DB8E physical-front fixture (6 HP).
# Eight buttons (B1.1..B1.8), one encoder (E1.1), LEDs (L1.1..L1.8 shown;
# the panel carries 32). [db8e] is schema-known but not yet in patch.rs
# KNOWN_CONTROLLER_SECTIONS, so these tokens currently group as a fallback
# "Controller 1" panel; registering the section name resolves the same file
# to the db8e geometry key.
# NOTE: no [encoder] sections here — "encoder" IS a known controller
# section and would claim number 1 for the E4 geometry instead.

[db8e]
    button1 = B1.1
    button2 = B1.2
    button3 = B1.3
    button4 = B1.4
    button5 = B1.5
    button6 = B1.6
    button7 = B1.7
    button8 = B1.8
    led1 = L1.1
    led2 = L1.2
    led3 = L1.3
    led4 = L1.4
    led5 = L1.5
    led6 = L1.6
    led7 = L1.7
    led8 = L1.8
    encoder = E1.1

[button]
    button = B1.1
    led = L1.1

[copy]
    input = E1.1
    output = _ENC1