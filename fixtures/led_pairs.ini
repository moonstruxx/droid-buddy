# Physical-era LED association fixture (5.1 reconciliation): the panel-era
# [button]/[pot] usage sections collapsed onto one "Button" controller with
# no geometry cells, so the physical view could not publish cells for the
# LED pairs. Declaring the pairs on real P2B8 faceplates gives every
# component a geometry element cell and keeps the boxed-LED intent testable:
# B1.1 folds L1.1 in, P1.1 folds L1.3 in, B1.2 and L1.2 stay plain/unfolded,
# and the second bare instance keeps the grid multi-module.

[p2b8]
    button = B1.1
    led = L1.1

[p2b8]
    pot = P1.1
    led = L1.3