# fixtures/optimizer_latency.ini — optimizer menu + preview-recoloring coverage
# (task 3.2). A single banner group chaining five circuits whose file order is
# deliberately scrambled so the optimizer has real work: `seq` (the cable
# source) sits last, so every edge wraps the loop boundary in the identity
# order. The banner-preserving min-sum candidate moves `seq` first and cuts
# the summed latency, which the menu's before/after values and the previewed
# latency ramp both show.
[out]
    input = _OUT
    output = O1

[vca]
    input = _FILT
    output = _OUT

[filter]
    input = _MIX
    output = _FILT

[mix]
    input = _SEQ
    output = _MIX

[seq]
    button = B1.1
    output = _SEQ