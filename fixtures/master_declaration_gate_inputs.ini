# LABELS: master=18
# The motokit clock/reset shape: a sequencer clocked on I1 and reset from I2.
# MASTER18 reads both jacks as logic levels, so `clock`/`reset` (trigger-typed)
# are legitimate uses there and the declared model hosts the whole patch.
[p2b8]
[motoquencer]
    clock = I1
    reset = I2
    cv = O1
    gate = O2
