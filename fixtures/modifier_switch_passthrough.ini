# modifier_switch_passthrough — influence walk fixture
# Exercises direct consumption, indirect via switch/copy/mix hops,
# copy chains, leaf termination, cycles, and HW->VAR derivation.

[p2b8]

# HW -> VAR derivation: B1.1 produces _TRIG and _EXTRA via two sections
[button]
    button = B1.1
    output = _TRIG

[copy]
    input = B1.1
    output = _EXTRA

[clocktool]
    output = _BASE

# direct consumption: _BASE consumed directly by leaf (no output) and hop
[copy]
    input = _BASE
    output = O1

[contour]
    input = _BASE

# copy chain: _TRIG -> _COPY1 -> _COPY2 -> leaf/mix hop
[copy]
    input = _TRIG
    output = _COPY1

[copy]
    input = _COPY1
    output = _COPY2

[contour]
    input = _COPY2

# indirect via switch: _TRIG -> switch (select) -> _SWOUT -> downstream
[switch]
    select = _TRIG
    input = _COPY1
    output = _SWOUT

[quantizer]
    input = _SWOUT
    output = O2

[mixer]
    input = _SWOUT
    output = _MIXOUT

[contour]
    input = _MIXOUT

# any-input+output hop (not allowlisted): logic/mix hop via _COPY2
[logic]
    input = _COPY2
    output = _LOGICOUT

[copy]
    input = _LOGICOUT

# leaf termination: consumes influenced cable with no output
[led]
    input = _SWOUT

[contour]
    input = _EXTRA

# cycle reachable from _TRIG: _TRIG -> _CYCLE_A <-> _CYCLE_B
[copy]
    input = _TRIG
    output = _CYCLE_A

[copy]
    input = _CYCLE_A
    output = _CYCLE_B

[copy]
    input = _CYCLE_B
    output = _CYCLE_A

[switch]
    select = _CYCLE_B
    output = O4
