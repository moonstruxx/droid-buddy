# LABELS: master=18
# A declared MASTER18 patch reading a CV input on I3, I5 and I7. MASTER18 has
# only I1/I2 and reads those as logic levels, so each of these three uses needs
# the MASTER. The declaration stays authoritative: three `master_conflict`
# warnings, and the patch still loads.
[p2b8]
[copy]
    input = I3
    output = O1
[copy]
    input = I5
    output = O2
[copy]
    input = I7
    output = O3
