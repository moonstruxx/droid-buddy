# graph_register_edges — register-edge graph regression fixture (task B 5.1)
#
# Exercises every register-edge scenario through the public
# Graph::build_from_patch entry point. Node indices are file-order:
#
#   0  p2b8               (bare controller → Controller node, ordinal 1)
#   1  buttonwriter        (catalog-output button = B1.1 → forward reg edge)
#   2  potreader           (catalog-input pot = P1.1 → reverse reg edge)
#   3  jackwriter          (output = O1 → forward jack edge)
#   4  jackreader          (input = I1 → reverse jack edge)
#   5  unknowncircuit_foobar (led = L1.1 → fallback output heuristic → forward)
#   6  jacksharer          (cv = O1 → shares O1 jack node with jackwriter)
#   7  vca                 (virtual cables only, no register refs)
#   8  b2fallback           (unknown circuit, button = B2.1 → unmatched
#                           controller ordinal 2 → InputJack fallback)
#
# The test injects a catalog schema (buttonwriter: button=output,
# potreader: pot=input) via set_test_schema before building.
[p2b8]

[buttonwriter]
output = _trig
button = B1.1

[potreader]
input = _trig
pot = P1.1

[jackwriter]
output = _sig
output = O1

[jackreader]
input = _sig
input = I1

[unknowncircuit_foobar]
output = _out
led = L1.1

[jacksharer]
input = _sig
cv = O1

[vca]
input = _sig
input = _trig
output = _vcaout

[b2fallback]
output = _out2
button = B2.1
