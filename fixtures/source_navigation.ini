# fixtures/source_navigation.ini — spans + boundary guard + select forms
# whole-line comment at top, followed by blank line

[p2b8] # inline comment after header

# repeated button sections, each with button/led tokens
[button]
    button = B1.1 # inline comment after token
    led = L1.1

[button]  # second button, same section name repeated
    button = B1.2
    led = L1.2
    output = _ENV1_DECAY_POT_ABSBIPOLAR * -1 + _DECAY_MIN # internal vars only

[button]
    button = B1.3
    led = L1.3
    # internal variable must not be misread as hardware token:
    input = _ENV1_DECAY_POT * 0.5

[copy]
    input = B1.1
    output = O1 # direct copy

[copy] # repeated copy
    input = B1.2
    output = O2

[copy]
    input = _MYVAR # internal only
    output = O3

# select forms for modifier graph (parsed now, consumed in task 1.2)
[switch]
    select = B1.1
    output = O4

[switch]
    select = P1.1
    selectat = 0.5
    output = O5

# transitive chain: B1.2 -> _TRANSIT -> select = _TRANSIT
[compare]
    input = B1.2
    output = _TRANSIT

[switch]
    select = _TRANSIT
    output = O6

# mixed expression with both hardware and internal in same value
[math]
    input = B1.1 + _ENV1_DECAY_POT * P1.1 # hardware P1.1 plus internal

# clean_end guard: token followed by underscore continuation is not a token
[copy]
    input = B1.1_extra # not a token, underscore continuation
    output = O7

# token at value start (boundary at i==0)
[copy]
    input = P1.2
    output = O8

# cycle chain: B1.3 produces _CYCLE_A, _CYCLE_A produces _CYCLE_B, _CYCLE_B produces _CYCLE_A
[copy]
    input = B1.3
    output = _CYCLE_A

[copy]
    input = _CYCLE_A
    output = _CYCLE_B

[copy]
    input = _CYCLE_B
    output = _CYCLE_A

[switch]
    select = _CYCLE_B
    selectat = 1
    output = O9

# direct hardware boolean select on P1.2 (no selectat)
[switch]
    select = P1.2
    output = O10

# longer transitive chain: B1.1 -> _CHAIN1 -> _CHAIN2 -> select
[copy]
    input = B1.1
    output = _CHAIN1

[copy]
    input = _CHAIN1
    output = _CHAIN2

[switch]
    select = _CHAIN2
    output = O11
