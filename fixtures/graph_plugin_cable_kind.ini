# fixtures/graph_plugin_cable_kind.ini — plugin-declared cable_kind proof (task 3.3).
# `plugkind` is a plugin circuit with `cable_kind = "control"` and a name that
# would be substring-inferred as Audio. It produces `_PLUGKIND`, consumed by
# the embedded `vca`, so `plugkind` is the producing circuit of the edge.
[plugkind]
    output = _PLUGKIND

[vca]
    input = _PLUGKIND

# Controller section so the parser has hardware components (real patches
# always declare one); it carries no cables so it adds only a node.
[p2b8]
