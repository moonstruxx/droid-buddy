# switch_value — hardware Switch (S token) rendering fixture.
# S1.1 is the switch under test; the test drives it to ComponentState::Value
# to pin the `◉ {:.0}%` rendering. S1.2 stays in the baseline On state so
# the retained `▣ ON` face is pinned beside the percentage.
# (5.1 reconciliation: the panel-era [switch]/[button]/[pot] usage sections
# resolved to controllers without geometry cells; the switches now sit on a
# resolvable [faderbank] -> p8s8 faceplate with real S cells.)

[faderbank]
    switch = S1.1
    output = _OUT

[faderbank]
    switch = S1.2