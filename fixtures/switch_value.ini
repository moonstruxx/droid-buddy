# switch_value — hardware Switch (S token) rendering fixture.
# S1.1 is the switch under test (addressable/clockable switch circuit); the
# test drives it to ComponentState::Value to pin the `◉ {:.0%}` rendering.
# S1.2 stays in the baseline On state so the retained `▣ ON` face is pinned
# beside the percentage. P1.1 gives the frame slider contrast so mono's
# switch token (DarkGray) provably differs from the slider/knob (White) in
# the same cell grid. The switch tokens live on the Faderbank faceplate
# (p8s8 geometry), whose S family carries switch cells — the physical view
# places them from controller geometry exactly like knobs/encoders/buttons.
# [faderbank] is the KNOWN controller section that claims controller
# number 1 (its `pot = P1.1` token also pins the slider to the same panel).

[switch]
    switch = S1.1
    output = _OUT

[switch]
    switch = S1.2

[faderbank]
    pot = P1.1