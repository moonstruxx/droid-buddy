# button_led_composition.ini — button-face + LED-fold fixture (button-led-composition 4.1).
# A P2B8, a B32 and an M4 declaring buttons with their LEDs, plus one element
# deliberately left without an LED (P2B8 pot P1.1, which `folded_led_for_element`
# resolves to None). The cross-layer story in src/regression.rs loads this file
# and asserts presence and token attribution only — never positions (those
# belong to tasks 1.1/1.2) — so it stays green across geometry regeneration.
# The patch must load with no Error-severity validation finding.

[p2b8]

[button]
    button = B1.1
    led = L1.1
    output = _BLC_A

[button]
    button = B1.2
    led = L1.2
    output = _BLC_B

[pot]
    pot = P1.1

[b32]

[button]
    button = B2.1
    led = L2.1
    output = _BLC_C

[button]
    button = B2.2
    led = L2.2
    output = _BLC_D

[m4]

[button]
    button = B3.1
    led = L3.1
    output = _BLC_E

[copy]
    input = _BLC_A
    output = O1
