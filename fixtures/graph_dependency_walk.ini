# graph_dependency_walk — upstream dependency-walk regression fixture (change D)
#
# Exercises the upstream walk through the public Graph::upstream_dependencies:
# an output jack (O1) fed by two producers, one through a cable (_mix) and one
# directly, an unrelated circuit, and a LED-write branch that must stay cut at
# the controller.
#
# Upstream of Jack(O1): mixer (_REG:O1), producer_b (_REG:O1), producer_a
# (_mix), and the two p2b8 controllers feeding B1.1/B2.1. Excluded: unrelated,
# led_writer (its LED write into the controller is not a dependency), and the
# sinks.

[p2b8]

[p2b8]

[producer_a]
    button = B1.1
    output = _mix

[mixer]
    input = _mix
    output = O1

[producer_b]
    button = B2.1
    output = O1

[led_writer]
    led = L1.1
    output = _led_feed

[sink_led]
    input = _led_feed

[unrelated]
    button = B3.1
    output = _elsewhere

[sink_else]
    input = _elsewhere