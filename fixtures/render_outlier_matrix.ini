# render_outlier_matrix — mixed-kind patch for the render-outlier snapshot
# channel (task 3.1/4.1).
#
# A bare [p2b8] synthesizes the 18 default P2B8 tokens (B1.1-B1.8,
# L1.1-L1.8, P1.1-P1.2) — buttons, LEDs, and knobs on Controller 1.
# S2.1/E2.1 add a Switch + Encoder on Controller 2; I2.1/O2.1 add CV I/O.
# All seven component kinds (button/led/knob/switch/encoder/cv_in/cv_out)
# therefore render in one frame, and the extractor's co-occurring-token
# contrast set is fully populated.
#
# Geometry: min_width = 18x16+2 (P2B8) + 2x16+2 (Controller 2) + 2x16+2
# (CV I/O) = 358, so 80/100/120 cols are degraded (overflow hint) while
# 358+ is a clean native fit in classic — and mono fails contrast at any
# width via the shift-group tokens (shift4 = Black on black).

[p2b8]

[switch]
    switch = S2.1
    output = _OUT2

[encoder]
    encoder = E2.1

[copy]
    input = I2.1
    output = O2.1