# Physical-scale-model task 5.1: multi-row rack proof fixture.
# Sixteen bare [p2b8] sections synthesize sixteen separate 18-token P2B8
# module instances (B{n}.1-8 / L{n}.1-8 / P{n}.1-2). At 5 HP (25.4 mm) each
# the chain runs ~466 mm — wider than one 80 HP (406.4 mm) rack row — so
# RackLayout::pack auto-packs row 0 to 15 faceplates and overflows the 16th
# plus the CV I/O master onto row 1. Tests pack this chain into a
# top/side-mount rack and assert row offsets, fold bars, mounts, and
# cross-row cell coincidence.

[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
# One CV I/O master faceplate (8 HP) joins the chain at the end; it lands on
# row 1 after the 16th P2B8 overflows row 0.
[copy]
    input = I1
    output = _X
