# led_register_colour.ini — static LED colour/brightness resolution fixture
# (led-register-colour 3.1). A P2B8 and an M4 carrying four LEDs that cover
# the load-time resolution matrix: a lit P2B8 button LED with a literal
# `ledcolor`/`ledvalue` pair, an M4 touch-plate twin with a literal colour,
# a button LED whose `ledcolor` rides a live cable (dynamic fallback), and a
# plain button+LED pair with no colour params (sourceless fallback). Colours
# are owned per-LED by `[motorfader]` sections mentioning the element token;
# a `[button]` section only pairs button+LED (the `button` circuit has no
# `ledcolor`/`ledvalue` params). The cross-layer story in src/regression.rs
# loads this file and asserts presence and token attribution only — never
# positions — so it stays green across geometry regeneration. The patch must
# load with no Error-severity validation finding.
#
# Instance numbering: bare controller sections take chain positions in file
# order, so [p2b8] is instance 1 (B1.x/L1.x) and [m4] is instance 2
# (B2.x/L2.x with default RGB twins per fixtures/device_led_defaults.ini).

[p2b8]

[m4]

[motorfader]
    button = B1.1
    ledcolor = 0.5
    ledvalue = 1

[button]
    button = B1.1
    led = L1.1
    output = _LRC_A

[motorfader]
    button = B2.1
    ledcolor = 0.8
    ledvalue = 1

[button]
    button = B1.3
    led = L1.3
    output = _LRC_B

[motorfader]
    button = B1.3
    ledcolor = _LIVE
    ledvalue = 1

[copy]
    input = I1
    output = _LIVE

[button]
    button = B1.4
    led = L1.4
    output = _LRC_C

[copy]
    input = _LRC_A
    output = O1
