# fixtures/cable_banner_combos.ini — real-fixture integration coverage for
# virtual-cable extraction (task 1.1) + comment-banner grouping (task 1.2).
# Shapes exercised together:
#   pre-first-banner circuit (implicit unnamed group) producing a cable
#   `# ---- Mixer ----` banner owning the following three circuits
#   a real cable (_CLOCK) whose source + sink both live inside the Mixer group
#   a cable (_GATE) whose source is in the unnamed group and sinks in Mixer
#   a commented-out cable map (`# output = _COMMENTED`) that must not leak
#   an expression-embedded token (`clock = _CLOCK * 2`) registered as a sink

[button]
    button = B1.1
    led = L1.1
    output = _GATE

# ---- Mixer ----
[clocktool]
    # commented-out cable map must not leak into the cable index
    #   output = _COMMENTED
    output = _CLOCK

[mixer]
    input = _GATE
    clock = _CLOCK * 2
    output = _MIX

[contour]
    gate = _GATE
    input = _MIX
    output = O1
