# module_ui_label_fit.ini — module-ui-label-fit (task 3.2) ladder-branch fixture.
#
# One small rack — a P8S8 and a P4B2 under the master faceplate — carrying five
# written labels, one for each outcome the per-cell font ladder can reach, so a
# single patch exercises every branch of the label fit plus the annotation
# fallback:
#
#   B2.1  a 9 mm button cell   — wraps to several lines at a step below the top
#   P2.1  a 12 mm pot cell     — fits whole on one line at the 10 pt top step
#   L2.1  a 3 mm LED cell      — no in-cell layout at all (annotation fallback)
#   P1.1  a P8S8 fader cell    — stacks one glyph per line beside the narrowed
#                                track
#   I1    a 7 mm master jack   — takes a step below the top
#
# P4B2 rather than P2B8/B32 carries the 9 mm button, the 12 mm pot and the
# 3 mm LED on purpose: P2B8 and B32 fold every button's LED into its face
# (button-led-composition D4) and suppress the standalone LED cell, so a
# written label on a 3 mm LED cannot coexist with an addressed button there.
# P4B2 is outside that fold rule, keeps the glyph path for its buttons and
# renders its LEDs as their own cells — and its faceplate has exactly the three
# cell sizes this fixture needs (9 mm button, 12 mm pot, 3 mm LED).
#
# Instance numbering: the bare [p8s8] takes chain position 1 (P1.x), so the
# [p4b2] block declares position 2 (B2.1/P2.1/L2.1). The labels are chosen for
# the branch, not for the patch: "Long decay time" needs three lines at the top
# step in a 9 mm cell, "Cutoff" still fits one 10 pt line in a 12 mm cell,
# "Gate input" steps down in a 7 mm jack, "Volume" stacks in the P8S8 column,
# and the LED's label is longer than any supported zoom can draw whole, so the
# label presentation — not the cell — has to carry it.
#
# Do NOT add a bare [p2b8]/[b32] section here: that synthesizes a full front
# and folds every LED. The patch must load with no Error-severity validation
# finding (and no finding at all).

# B2.1: Long decay time
# P2.1: Cutoff
# L2.1: Signal Master Filter Trigger Random Sector Switch
# P1.1: Volume
# I1: Gate input

[p8s8]

[p4b2]
    pot = P2.1
    led = L2.1

[button]
    button = B2.1

[copy]
    input = I1
    output = O1
