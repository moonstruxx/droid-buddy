# module_ui_label_fit.ini — module-ui-label-fit (task 3.2) ladder-branch fixture.
#
# One small rack — a P8S8, a P10 and a DB8E under the master faceplate —
# carrying five written labels, one for each outcome the per-cell font ladder can
# reach, so a single patch exercises every branch of the label fit plus the
# annotation fallback:
#
#   B3.1  a 9 mm button cell    — wraps to several lines at a step below the top
#   P2.1  a 12 mm pot cell      — fits whole on one line at the 10 pt top step
#   L1    a 1.8 mm LED cell     — no in-cell layout at all (annotation fallback)
#   P1.1  a P8S8 fader cell     — stacks one glyph per line beside the narrowed
#                                 track
#   I1    a 7 mm master jack    — takes a step below the top
#
# The carriers are the controllers that keep the compact/glyph path and a
# standalone LED cell. The bracket faces (P2B8, P4B2, B32, M4) fold a button's
# LED into the button and suppress the standalone LED cell
# (button-led-composition D4), so an addressed button plus a written label on a
# 3 mm LED cannot coexist there — which is why the button and the LED sit on the
# DB8E (nine-millimetre buttons, a 1.8 mm LED row, no fold rule) and the pot on
# the P10.
#
# Instance numbering: bare controller sections take chain positions 1..3 in
# file order, so the DB8E declares B3.1 (its LED row is addressed by the global
# register names L1..L32, not by instance). The labels are chosen for the
# branch, not for the patch: "Long decay time" needs three lines at the top step
# in a 9 mm cell, "Cutoff" still fits one 10 pt line in a 12 mm cell, "Gate
# input" steps down in a 7 mm jack, "Volume" stacks in the P8S8 column, and the
# LED's label is longer than any supported zoom can draw whole, so the label
# presentation — not the cell — has to carry it.
#
# Do NOT add a bare [p2b8]/[p4b2]/[b32] section here: that synthesizes a full
# front and folds every LED. The patch must load with no Error-severity
# validation finding (and no finding at all).

# B3.1: Long decay time
# P2.1: Cutoff
# L1: Signal Master Filter Trigger Random Sector Switch
# P1.1: Volume
# I1: Gate input

[p8s8]

# P2.1 carries the two pot branches: a long label that ellipsizes in `auto`
# and a short one that is drawn whole (the reveal tests hover both).
[p10]
    pot = P2.1
    pot2 = P2.2

[db8e]
    button = B3.1
    led = L1

[copy]
    input = I1
    output = O1
