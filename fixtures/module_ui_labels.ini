# module_ui_labels.ini — module-ui-labels (task 3.1) fixture.
# A partial B32 front (three of 32 buttons via `[notebuttons]`, the usage-based
# section that binds to the b32 faceplate) with no other controller, so the
# rack is a single 50.8 mm module beside the 40.64 mm master and fits at true
# size in a pane one true-size rack tall. The preamble labels are chosen for the
# B32's 9 mm button cells at 1:1, whose composed face budgets five 10 pt
# monospace characters: "Go" fits in its cell and is never annotated, while
# "Trigger input" and "Clock reset" are clipped and are exactly the labels the
# `auto` presentation annotates. All three sit in the B32's fourth button row,
# whose cells bind to the rack's right-side annotation band, so the callouts
# have horizontal pane margin to paint in.
#
# Do NOT use bare `[b32]`: it synthesizes the full 32B+32L front and can never
# be partial. The patch must load with no Error-severity validation finding.

# B1.18: Go
# B1.19: Trigger input
# B1.20: Clock reset

[notebuttons]
    button1 = B1.18
    button2 = B1.19
    button3 = B1.20
    led1 = L1.18
    led2 = L1.19
    led3 = L1.20
