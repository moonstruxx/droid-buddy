# unreferenced_elements.ini — unreferenced-elements 3.1 fixture.
# A partial B32 (5 of 32 buttons via `[notebuttons]`, the usage-based section
# that binds to the b32 faceplate) plus a bare `[e4]` (synthesizing 4
# encoders, 4 buttons, 4 LEDs, leaving 124 of 128 ring segments unaddressed).
# Do NOT use bare `[b32]` here: it synthesizes the full 32B+32L front and can
# never be partial. The cross-layer story in src/regression.rs loads this file
# and asserts presence and token attribution only — never positions — so it
# stays green across geometry regeneration. The patch must load with no
# Error-severity validation finding.

[notebuttons]
    button1 = B3.1
    button2 = B3.2
    button3 = B3.3
    button4 = B3.4
    button5 = B3.5
    led1 = L3.1
    led2 = L3.2
    led3 = L3.3
    led4 = L3.4
    led5 = L3.5

[e4]
