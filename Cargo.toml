[package]
name = "droid_tui"
version = "0.1.0"
edition = "2021"
description = "TUI for loading and interacting with DROID hardware patches"

[dependencies]
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# GPU graph window stack — unconditional (gpu-graph-window design D2).
winit = "0.30"
egui = "0.36"
egui-winit = "0.36"
egui-wgpu = "0.36"
wgpu = "30"
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }

[dev-dependencies]
tempfile = "3"
