# Test patch for numbered circuit LED params (droid_tui-abt): matrixmixer-style
# pairing where buttonN/ledN share a matrix-position suffix. button11 = B1.1
# must render as a single boxed cell with L1.1 folded; button12 = B1.2 with L1.2.

[matrixmixer]
    button11 = B1.1
    button12 = B1.2
    led11 = L1.1
    led12 = L1.2
