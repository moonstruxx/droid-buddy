# fixtures/graph_topology_error.ini — topology-error highlight (task 5.3).
# `_CLK` is driven by two sources (clocktool + divider): an n -> 1 topology
# Error, so every `_CLK` edge must render with the graph_edge_error token
# (red) instead of its inferred control color (cyan).
# ---- Sources ----
[clocktool]
    output = _CLK

[divider]
    output = _CLK

# ---- Sinks ----
[copy]
    input = _CLK

# Controller section so the parser has hardware components (real patches
# always declare one); it carries no cables so it adds only a node.
[p2b8]
