# fixtures/graph_latency_fanout.ini — mixed mid-latency fan-out (task 2.2).
# One source (clocktool) fans out to sinks at increasing file-order distances,
# so the per-edge forward-loop latency varies across the mid ramp (1, 2, 3
# loop steps) while every edge stays forward (no back-edge).
[clocktool]
    output = _CLK

[copy]
    input = _CLK
    output = _AUD

[mixer]
    input = _CLK
    output = _MIX

[contour]
    gate = _CLK

# Controller section so the parser has hardware components (real patches
# always declare one); it carries no cables so it adds only a node.
[p2b8]
