    clock = _PULSARCLOCK
    reset = G7
    divide = _CCPOT1T4 * 24
    multiply = _CCPOT2T4 * 8
    output = _ALGOC4

[button]
    button = B2.2
    states = 1
    longpress = _TRIGGEROUSWITCHT4

[bernoulli]
    input = _GATEST4
    distribution = _CCPOT7T4
    output1 = _KEEPGATEST4

[fold]
    input = _SPRINGVELOCITY2
    foldby = 0.1
    minimum = 0
    maximum = 0.4
    output = _DELAY_OFFSET4

[fold]
    input = _SPRINGPOS2
    foldby = 0.1
    minimum = 0
    maximum = 0.4
    output = _GATELEN_OFFSET4

[bernoulli]
    input = _KEEPGATEST4
    distribution = _CCPOT8T4
    output1 = _TRIG_DELAY4
    output2 = _TRIG_RESIZE_DELAY4

[triggerdelay]
    input = _TRIG_DELAY4
    delay = _CCPOT3T4 + _DELAY_OFFSET4
    repeats = 1
    output = _DELAYED4

[triggerdelay]
    input = _TRIG_RESIZE_DELAY4
    delay = _CCPOT3T4 + _DELAY_OFFSET4
    repeats = 1
    output = _DELAYED_RESIZED4
    gatelength = _CCPOT4T4 + _GATELEN_OFFSET4

[copy]
    input = _DELAYED4 + _DELAYED_RESIZED4
    output = _DELAYED_GATES4

[contour]
    gate = _DELAYED_GATES4
    attack = _CCPOT9T4
    hold = 0
    decay = _CCPOT11T4
    sustain = _CCPOT10T4
    release = _CCPOT12T4
    output = _CONTUR4

[euklid]
    clock = _ALGOC4
    reset = G8
    length = _CCPOT5T4 * 16
    beats = _CCPOT6T4 * 16
    offset = _CCPOT7T4 * 8
    output = _EUKLID_AGATE4
    outputsignal = _DELAYED_GATES4 * _PITCH4

[switch]
    input1 = _CONTUR4
    input2 = _DELAYED_GATES4 * _PITCH4
    input3 = _EUKLID_AGATE4
    input4 = _DELAYED_GATES4
    forward = _TRIGGEROUSWITCHT4
    input5 = _SPRINGPOS1
    input6 = _SPRINGVELOCITY1
    input7 = _SPRINGPOS2
    input8 = _SPRINGVELOCITY2
    offset = 0
    output1 = _UNSCALED_OUT4
    reset = _RESET

[switch]
    input1 = 0
    input2 = 0.2
    input3 = 0.4
    forward = _TRIGGEROUSWITCHT4
    offset = 0
    output1 = R4
    reset = _RESET
    input4 = 0.6
    input5 = 0.8
    input6 = 1
    input7 = 1.2
    input8 = 1

[crossfader]
    fade = _PRESETFADER
    output = _FINAL_MIX4
    input1 = _UNSCALED_OUT4 * _POTSCALET4 + _POTSBIAST4
    input2 = _PRESETCV4

[slew]
    input = _FINAL_MIX4
    slew = _CCPOT16T4
    scurve = O4

