# fixtures/graph_latency_chain.ini — all-forward low-latency chain (task 2.2).
# A linear source→sink chain: every edge's source section precedes its sink
# section in file order, so all edges are forward (no loop wrap) and adjacent
# (one loop step) — every cable lands at the low end of the latency ramp.
[clocktool]
    output = _CLK

[copy]
    input = _CLK
    output = _AUD

[mixer]
    input = _AUD
    output = _MIX

[contour]
    gate = _MIX

# Controller section so the parser has hardware components (real patches
# always declare one); it carries no cables so it adds only a node.
[p2b8]
