# fixtures/graph_latency_backedge.ini — back-edge → red end (task 2.2).
# A cable wrapping the loop: `_LOOP` is produced by a later section ([lfo])
# but consumed by an earlier one ([contour]), so the sink reads last loop's
# value and the edge lands at the red end of the latency ramp (is_back_edge).
# Realistic DROID modulation shape: a clock drives a button and an LFO whose
# output feeds back into the earlier envelope section.
[button]
    button = B1.1
    output = _GATE

[contour]
    gate = _GATE
    gate = _LOOP

[lfo]
    rate = _GATE
    output = _LOOP

# Controller section so the parser has hardware components (real patches
# always declare one); it carries no cables so it adds only a node.
[p2b8]
