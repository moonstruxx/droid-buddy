# switch_value — hardware Switch (S token) rendering fixture.
# S1.1 is the switch under test (addressable/clockable switch circuit); the
# test drives it to ComponentState::Value to pin the `◉ {:.0}%` rendering.
# S1.2 stays in the baseline On state so the retained `▣ ON` face is pinned
# beside the percentage. B1.1/P1.1 give the frame button/knob contrast so
# mono's switch token (DarkGray) provably differs from button/knob (White)
# in the same cell grid.

[switch]
    switch = S1.1
    output = _OUT

[switch]
    switch = S1.2

[button]
    button = B1.1

[pot]
    pot = P1.1