# Test patch for LED association across all control kinds (task 2.1).
# Numbered element params (potN/encoderN/switchN/faderN) pair with their
# same-suffix ledN; a bare `led =` pairs with the section's element token.
# The faderN/`[fader]` sections are synthetic: DROID faders are addressed by
# number (firstfader), never by hardware token, but M tokens (M4 motor
# faders) are valid hardware tokens in the signal-flow graph layer and are
# used here to exercise fader+LED association.

[pot]
    pot1 = P1.1
    led1 = L1.1

[encoder]
    encoder1 = E1.1
    led1 = L1.2

[switch]
    switch1 = S1.1
    led1 = L1.3

[fader]
    fader1 = M1.1
    led1 = L1.4

[pot]
    pot = P1.2
    led = L1.5

[encoder]
    encoder = E1.2
    led = L1.6

[switch]
    switch = S1.2
    led = L1.7

[fader]
    fader = M1.2
    led = L1.8